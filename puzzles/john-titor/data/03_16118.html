        <script type="application/json" id="data-preloaded">{"topic_16118":"{\"post_stream\":{\"posts\":[{\"id\":16119,\"name\":null,\"username\":\"Cosmo\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/cosmo/{size}/835_2.png\",\"created_at\":\"2022-05-19T14:15:46.000Z\",\"cooked\":\"\\u003cpre data-code-wrap=\\\"curiobase\\\"\\u003e\\u003ccode class=\\\"lang-curiobase\\\"\\u003etype: subject\\nslug: art-bell-faxes\\nkind: document\\ndomain: time\\nstatus: open\\nperiod: 1990s\\nevidence: documentary-record\\nsource_site: Coast to Coast AM fax line\\ntransmitted: July 29, 1998 and late 1998\\noperator: Unsigned\\npart_of: john-titor\\ndek: Two unsigned faxes to Art Bell in 1998 describing CERN singularities, a temporal barrier at 2564, and a promise of photographs — two years before TimeTravel_0 posted a word.\\n\\u003c/code\\u003e\\u003c/pre\\u003e\",\"post_number\":1,\"post_type\":1,\"posts_count\":11,\"updated_at\":\"2026-09-06T15:48:08.546Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":391,\"reads\":19,\"readers_count\":18,\"score\":1963.8,\"yours\":false,\"topic_id\":16118,\"topic_slug\":\"the-art-bell-faxes\",\"display_username\":null,\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":2,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://timetravelinstitute.com/t/john-titor-the-original-posts-on-the-time-travel-institute-2000-2001/19725\",\"internal\":true,\"reflection\":true,\"title\":\"John Titor: The Original Posts on the Time Travel Institute (2000–2001)\",\"clicks\":1}],\"read\":true,\"user_title\":\"Owner\",\"title_is_group\":false,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":true,\"admin\":true,\"staff\":true,\"user_id\":1,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"user_custom_fields\":{\"geo_location\":\"{\\\"lat\\\":\\\"35.6729639\\\",\\\"lon\\\":\\\"-79.0392919\\\",\\\"address\\\":\\\"North Carolina, United States\\\",\\\"countrycode\\\":\\\"us\\\",\\\"city\\\":\\\"\\\",\\\"state\\\":\\\"North Carolina\\\",\\\"country\\\":\\\"United States\\\",\\\"postalcode\\\":\\\"\\\",\\\"boundingbox\\\":[\\\"33.7528780\\\",\\\"36.5881570\\\",\\\"-84.3218293\\\",\\\"-75.4001190\\\"],\\\"type\\\":\\\"administrative\\\",\\\"showType\\\":\\\"false\\\",\\\"id\\\":\\\"North Carolina, United States\\\"}\"},\"post_url\":\"/t/the-art-bell-faxes/16118/1\",\"event\":null,\"calendar_details\":[],\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":1}],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null,\"can_vote\":false},{\"id\":126611,\"name\":null,\"username\":\"Cosmo\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/cosmo/{size}/835_2.png\",\"created_at\":\"2022-05-19T14:18:25.000Z\",\"cooked\":\"\\u003cp\\u003eTwo unsigned faxes were sent to Art Bell in 1998. Both were later attributed to John Titor, and both are transcribed below.\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eThe first fax\\u003c/strong\\u003e — July 29, 1998\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eThe second fax\\u003c/strong\\u003e — late 1998 (exact date unknown)\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-126611-the-first-fax-july-29-1998-1\\\" class=\\\"anchor\\\" href=\\\"#p-126611-the-first-fax-july-29-1998-1\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eThe first fax — July 29, 1998\\u003c/h2\\u003e\\n\\u003cp\\u003eThe first fax, later attributed to John Titor, is believed by some to be a precursor or test run by the original author of the Titor story, or perhaps an alternate version of him.\\u003c/p\\u003e\\n\\u003cp\\u003eWhile the content aligns with Titor’s later claims about time travel mechanics and future events, Titor himself never stated that he was present in 1998. This discrepancy has fueled speculation about whether the fax represents an early iteration of the narrative or a separate, parallel attempt to introduce the concept of a time traveler to Art Bell’s audience.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-126611-transcription-2\\\" class=\\\"anchor\\\" href=\\\"#p-126611-transcription-2\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eTranscription\\u003c/h3\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eFAX TRANSMISSION \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#1\\u003c/span\\u003e\\u003cbr\\u003e\\n—————————————\\u003cbr\\u003e\\nFrom: ████████████████\\u003cbr\\u003e\\nTo: +1 (702) 555-7890\\u003cbr\\u003e\\nDate: 07/29/1998\\u003cbr\\u003e\\nPage: 1 of 1\\u003cbr\\u003e\\n—————————————\\u003c/p\\u003e\\n\\u003cp\\u003eDear Art,\\u003c/p\\u003e\\n\\u003cp\\u003eI had to fax when I heard other time travelers calling in from any time past the year 2500 AD. Please let me explain.\\u003c/p\\u003e\\n\\u003cp\\u003eTime travel was invented in 2034. Off-shoots of certain successful fusion reactor research allowed scientists at CERN to produce the world’s first contained singularity engine. The basic design involves rotating singularities inside a magnetic field. By altering the speed and direction of rotation, you can travel both forward and backward in time.\\u003c/p\\u003e\\n\\u003cp\\u003eTime itself can be understood in terms of connected lines. When you go back in time, you travel on your original timeline. When you turn your singularity engine off, a new timeline is created, due to the fact that you and your time machine are now there. In other words, a new universe is created.\\u003c/p\\u003e\\n\\u003cp\\u003eTo get back to your original line, you must travel a split second father back, and immediately throw the engine into forward without turning it off.\\u003c/p\\u003e\\n\\u003cp\\u003eSome interesting outcomes of this are:\\u003c/p\\u003e\\n\\u003cp\\u003eOne, you meet yourself. I have done it often, even taken a younger version of myself along for a few rides before returning myself to the new timeline and going back to mine.\\u003c/p\\u003e\\n\\u003cp\\u003eTwo, you can alter history in the new universe that you have just created. Most of the time, the changes are subtle. Sometimes, I’ll notice car models that don’t exist, or books that come out late.\\u003c/p\\u003e\\n\\u003cp\\u003eThe oldest one was a skyscraper that wasn’t built in a near favorite store of mine in New York.\\u003c/p\\u003e\\n\\u003cp\\u003eInterestingly, when you travel in time, you must compensate for the orbit of the earth. Since the time machine doesn’t move, you have to adjust the engines so you remain on the planet when you turn it off. Unfortunately, it was also discovered that anyone going forward in time, from my 2036, hit a brick wall in the year 2564.\\u003c/p\\u003e\\n\\u003cp\\u003eEveryone who has ever been there has reported that nothing exists. When the machine is turned off, you find yourself surrounded by blackness and silence.\\u003c/p\\u003e\\n\\u003cp\\u003eNow, most time travelers are trying to find out where the line went bad by going into the past, creating a new universe, and proceeding forward to see if the same thing results in 2564. It appears the line went bad around the year 2000. I’m here now, in this time, to test a few theories of mine before going forward.\\u003c/p\\u003e\\n\\u003cp\\u003eNow, for the future you might want to know about.\\u003c/p\\u003e\\n\\u003cp\\u003eOne, Y2K is a disaster. Many people die on the highways when they freeze to death trying to get to warmer weather.\\u003c/p\\u003e\\n\\u003cp\\u003eTwo, the government tries to keep power by instituting marshall law, but all of it collapses when their efforts to bring the power back up fail.\\u003c/p\\u003e\\n\\u003cp\\u003eThree, a power facility in Denver is able to restart itself, but is mobbed by hundreds of thousands of people and destroyed. This convinces most that maybe we shouldn’t bring the old system back up.\\u003c/p\\u003e\\n\\u003cp\\u003eFour, a few years later, communal government system is developed, after the constitution takes a few twists.\\u003c/p\\u003e\\n\\u003cp\\u003eChina retakes Taiwan, Israel wins the largest battle for their life, and Russia is covered in nuclear snow from their collapsed reactors.\\u003c/p\\u003e\\n\\u003cp\\u003eArt, the reason I’m here now is because I believe a nuclear weapon set off by Iraq in the Middle East war with Israel might have something to do with the damaged timeline. I will test that theory and get back to you.\\u003c/p\\u003e\\n\\u003cp\\u003ePlease pray that we discover the reason why there is no apparent future after 2564.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-126611-video-3\\\" class=\\\"anchor\\\" href=\\\"#p-126611-video-3\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eVideo\\u003c/h3\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://www.youtube.com/watch?v=Sa0Jg_GekFA\\\"\\u003eJohn Titor 1st Fax sent to Art Bell (July 29th, 1998)\\u003c/a\\u003e (YouTube)\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-126611-the-second-fax-late-1998-exact-date-unknown-4\\\" class=\\\"anchor\\\" href=\\\"#p-126611-the-second-fax-late-1998-exact-date-unknown-4\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eThe second fax — late 1998 (exact date unknown)\\u003c/h2\\u003e\\n\\u003cp\\u003eThis second fax, later attributed to John Titor, follows the first within a short interval, though the exact date remains unknown. In it, the sender:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003ereiterates their identity as a time traveler, reflecting on their extended stay on this world line and expressing a desire to assist its future development;\\u003c/li\\u003e\\n\\u003cli\\u003eurges Art Bell to preserve broadcasts on military technology and new physics, suggesting their value to future researchers;\\u003c/li\\u003e\\n\\u003cli\\u003eurges him to reconsider his views on Russia, claiming that the nation will ultimately save millions of Americans;\\u003c/li\\u003e\\n\\u003cli\\u003epromises additional proof, including excerpts from their time machine’s manual and photographs of the vehicle.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eThe fax continues to deepen the narrative, blending warnings about the future with a willingness to engage in further dialogue. This communication strengthens the foundation of what would later become the John Titor story.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-126611-transcription-5\\\" class=\\\"anchor\\\" href=\\\"#p-126611-transcription-5\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eTranscription\\u003c/h3\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eFAX TRANSMISSION \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#2\\u003c/span\\u003e\\u003cbr\\u003e\\n—————————————\\u003cbr\\u003e\\nFrom: ████████████████\\u003cbr\\u003e\\nTo: +1 (702) 555-7890\\u003cbr\\u003e\\nDate: ████████\\u003cbr\\u003e\\nPage: 1 of 1\\u003cbr\\u003e\\n—————————————\\u003c/p\\u003e\\n\\u003cp\\u003eDear Mr. Bell,\\u003c/p\\u003e\\n\\u003cp\\u003eI am glad you’re back. I faxed this information to you the day before you left the air. I wanted to make sure it wasn’t lost in the shuffle so I am sending a gift. If you’ve already seen this please accept my apologies. If you choose to make this public please do not publish the fax number. I had to fax when I heard the other time traveler calling in from the recent time past in fact the year 2500 Ad.\\u003c/p\\u003e\\n\\u003cp\\u003eLet me explain, Mr. Bell. I sent a fax with this opening on July 29 1998. As I said then I am a time traveler. I have been on this world line since April of this year and I plan to leave soon. Typically time travelers do not purposely affect the world lines they visit. However, this mission is unusually long and I’ve grown attached to some of the people I have met here.\\u003c/p\\u003e\\n\\u003cp\\u003eAnyway, for my own reasons I have decided to help this world line by sharing information about the future with a few people in the hope that it will help their future. I am contacting you for the same reason. Unfortunately there is no historical reference to your program in my worldline.\\u003c/p\\u003e\\n\\u003cp\\u003eI believe you can change your future by creating one now.\\u003c/p\\u003e\\n\\u003cp\\u003eSome of the information presented on your program may be invaluable to up-line researchers. I suggest you isolate the programs that concentrate on military technology and new physics theories. Transcribe these programs and put them someplace safe away from the box. I recommend someplace in the midwest.\\u003c/p\\u003e\\n\\u003cp\\u003eI also urge you to reconsider your paranoia to the Russians.\\u003c/p\\u003e\\n\\u003cp\\u003eThey are not preparing for war with the average US citizen. They are preparing for war with the US government. They will eventually save this country and the lives of million of Americans.\\u003c/p\\u003e\\n\\u003cp\\u003eI realize my claims are a bit difficult to accept so I will send the following once I know you have received this fax. A few pages from the operations manual of my time machine. And a few colored photographs of my vehicle.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you wish to contact me I will be happy to share with you the nature of time, the physics of time travel and some of the events of your future.\\u003c/p\\u003e\\n\\u003cp\\u003ePlease send a return package to\\u003c/p\\u003e\\n\\u003cp\\u003e██████████\\u003cbr\\u003e\\n█████████████████\\u003cbr\\u003e\\n███████████████\\u003cbr\\u003e\\n█████\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\",\"post_number\":2,\"post_type\":1,\"posts_count\":11,\"updated_at\":\"2026-10-01T04:23:19.887Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":5,\"reads\":8,\"readers_count\":7,\"score\":26.6,\"yours\":false,\"topic_id\":16118,\"topic_slug\":\"the-art-bell-faxes\",\"display_username\":null,\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":6,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://www.youtube.com/watch?v=Sa0Jg_GekFA\",\"internal\":false,\"reflection\":false,\"clicks\":0}],\"read\":true,\"user_title\":\"Owner\",\"title_is_group\":false,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":true,\"admin\":true,\"staff\":true,\"user_id\":1,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"user_custom_fields\":{\"geo_location\":\"{\\\"lat\\\":\\\"35.6729639\\\",\\\"lon\\\":\\\"-79.0392919\\\",\\\"address\\\":\\\"North Carolina, United States\\\",\\\"countrycode\\\":\\\"us\\\",\\\"city\\\":\\\"\\\",\\\"state\\\":\\\"North Carolina\\\",\\\"country\\\":\\\"United States\\\",\\\"postalcode\\\":\\\"\\\",\\\"boundingbox\\\":[\\\"33.7528780\\\",\\\"36.5881570\\\",\\\"-84.3218293\\\",\\\"-75.4001190\\\"],\\\"type\\\":\\\"administrative\\\",\\\"showType\\\":\\\"false\\\",\\\"id\\\":\\\"North Carolina, United States\\\"}\"},\"post_url\":\"/t/the-art-bell-faxes/16118/2\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":109261,\"name\":\"FTD\",\"username\":\"FTD\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/f/C9556F/{size}.png\",\"created_at\":\"2022-07-23T09:32:25.000Z\",\"cooked\":\"\\u003cp\\u003eIs there third fax?\\u003c/p\\u003e\",\"post_number\":3,\"post_type\":1,\"posts_count\":11,\"updated_at\":\"2026-08-02T20:53:35.042Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":3,\"reads\":12,\"readers_count\":11,\"score\":22.4,\"yours\":false,\"topic_id\":16118,\"topic_slug\":\"the-art-bell-faxes\",\"display_username\":\"FTD\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":6319,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/the-art-bell-faxes/16118/3\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":109262,\"name\":\"FTD\",\"username\":\"FTD\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/f/C9556F/{size}.png\",\"created_at\":\"2022-07-23T09:34:04.000Z\",\"cooked\":\"\\u003cp\\u003eWhat may happen to the world right exactly at 2564 by nature?\\u003c/p\\u003e\",\"post_number\":4,\"post_type\":1,\"posts_count\":11,\"updated_at\":\"2026-08-02T20:53:35.037Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":6,\"reads\":15,\"readers_count\":14,\"score\":33.0,\"yours\":false,\"topic_id\":16118,\"topic_slug\":\"th lse,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/the-art-bell-faxes/16118/5\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":111580,\"name\":\"Jay Walker\",\"username\":\"Jay_Walker\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/jay_walker/{size}/446_2.png\",\"created_at\":\"2024-10-23T02:12:53.000Z\",\"cooked\":\"\\u003cp\\u003e“You can alter history in the new universe you have just created. Most of the time, the changes are subtle. Sometimes, I’ll notice there are car models that don’t exist, or books that come out late. The oldest one was a skyscraper that wasn’t built in a near favorite store of mine in New York.”\\u003c/p\\u003e\\n\\u003cp\\u003eDoes anyone understand the sentence “The oldest one, was a skyscraper that wasn’t built in a near favorite store of mine in New York.”\\u003c/p\\u003e\\n\\u003cp\\u003eThe oldest what?\\u003cbr\\u003e\\nThe skyscraper wasn’t built \\u003cem\\u003einside\\u003c/em\\u003e the store?\\u003cbr\\u003e\\nWhat does he mean by \\u003cem\\u003enear\\u003c/em\\u003e favorite store?\\u003c/p\\u003e\\n\\u003cp\\u003eIf he means that the skyscraper wasn’t built near his favorite store, then what did he mean by “oldest one”\\u003c/p\\u003e\\n\\u003cp\\u003eAnother question:\\u003c/p\\u003e\\n\\u003cp\\u003eIf you travel backwards on your own timeline why is there a divergence while traveling back? I can understand a divergence after shutting down the machine, because the machine and you being there is already different. Everything from then on forward would change. I think.\\u003cbr\\u003e\\nAnyone understand this?\\u003c/p\\u003e\",\"post_number\":7,\"post_type\":1,\"posts_count\":11,\"updated_at\":\"2026-08-02T20               <p>Two unsigned faxes were sent to Art Bell in 1998. Both were later attributed to John Titor, and both are transcribed below.</p>
<ul>
<li><strong>The first fax</strong> — July 29, 1998</li>
<li><strong>The second fax</strong> — late 1998 (exact date unknown)</li>
</ul>
<hr>
<h2><a name="p-126611-the-first-fax-july-29-1998-1" class="anchor" href="#p-126611-the-first-fax-july-29-1998-1" aria-label="Heading link"></a>The first fax — July 29, 1998</h2>
<p>The first fax, later attributed to John Titor, is believed by some to be a precursor or test run by the original author of the Titor story, or perhaps an alternate version of him.</p>
<p>While the content aligns with Titor’s later claims about time travel mechanics and future events, Titor himself never stated that he was present in 1998. This discrepancy has fueled speculation about whether the fax represents an early iteration of the narrative or a separate, parallel attempt to introduce the concept of a time traveler to Art Bell’s audience.</p>
<h3><a name="p-126611-transcription-2" class="anchor" href="#p-126611-transcription-2" aria-label="Heading link"></a>Transcription</h3>
<blockquote>
<p>FAX TRANSMISSION <span class="hashtag-raw">#1</span><br>
—————————————<br>
From: ████████████████<br>
To: +1 (702) 555-7890<br>
Date: 07/29/1998<br>
Page: 1 of 1<br>
—————————————</p>
<p>Dear Art,</p>
<p>I had to fax when I heard other time travelers calling in from any time past the year 2500 AD. Please let me explain.</p>
<p>Time travel was invented in 2034. Off-shoots of certain successful fusion reactor research allowed scientists at CERN to produce the world’s first contained singularity engine. The basic design involves rotating singularities inside a magnetic field. By altering the speed and direction of rotation, you can travel both forward and backward in time.</p>
<p>Time itself can be understood in terms of connected lines. When you go back in time, you travel on your original timeline. When you turn your singularity engine off, a new timeline is created, due to the fact that you and your time machine are now there. In other words, a new universe is created.</p>
<p>To get back to your original line, you must travel a split second father back, and immediately throw the engine into forward without turning it off.</p>
<p>Some interesting outcomes of this are:</p>
<p>One, you meet yourself. I have done it often, even taken a younger version of myself along for a few rides before returning myself to the new timeline and going back to mine.</p>
<p>Two, you can alter history in the new universe that you have just created. Most of the time, the changes are subtle. Sometimes, I’ll notice car models that don’t exist, or books that come out late.</p>
<p>The oldest one was a skyscraper that wasn’t built in a near favorite store of mine in New York.</p>
<p>Interestingly, when you travel in time, you must compensate for the orbit of the earth. Since the time machine doesn’t move, you have to adjust the engines so you remain on the planet when you turn it off. Unfortunately, it was also discovered that anyone going forward in time, from my 2036, hit a brick wall in the year 2564.</p>
<p>Everyone who has ever been there has reported that nothing exists. When the machine is turned off, you find yourself surrounded by blackness and silence.</p>
<p>Now, most time travelers are trying to find out where the line went bad by going into the past, creating a new universe, and proceeding forward to see if the same thing results in 2564. It appears the line went bad around the year 2000. I’m here now, in this time, to test a few theories of mine before going forward.</p>
<p>Now, for the future you might want to know about.</p>
<p>One, Y2K is a disaster. Many people die on the highways when they freeze to death trying to get to warmer weather.</p>
<p>Two, the government tries to keep power by instituting marshall law, but all of it collapses when their efforts to bring the power back up fail.</p>
<p>Three, a power facility in Denver is able to restart itself, but is mobbed by hundreds of thousands of people and destroyed. This convinces most that maybe we shouldn’t bring the old system back up.</p>
<p>Four, a few years later, communal government system is developed, after the constitution takes a few twists.</p>
<p>China retakes Taiwan, Israel wins the largest battle for their life, and Russia is covered in nuclear snow from their collapsed reactors.</p>
<p>Art, the reason I’m here now is because I believe a nuclear weapon set off by Iraq in the Middle East war with Israel might have something to do with the damaged timeline. I will test that theory and get back to you.</p>
<p>Please pray that we discover the reason why there is no apparent future after 2564.</p>
</blockquote>
<h3><a name="p-126611-video-3" class="anchor" href="#p-126611-video-3" aria-label="Heading link"></a>Video</h3>
<p><a href="https://www.youtube.com/watch?v=Sa0Jg_GekFA">John Titor 1st Fax sent to Art Bell (July 29th, 1998)</a> (YouTube)</p>
<hr>
<h2><a name="p-126611-the-second-fax-late-1998-exact-date-unknown-4" class="anchor" href="#p-126611-the-second-fax-late-1998-exact-date-unknown-4" aria-label="Heading link"></a>The second fax — late 1998 (exact date unknown)</h2>
<p>This second fax, later attributed to John Titor, follows the first within a short interval, though the exact date remains unknown. In it, the sender:</p>
<ul>
<li>reiterates their identity as a time traveler, reflecting on their extended stay on this world line and expressing a desire to assist its future development;</li>
<li>urges Art Bell to preserve broadcasts on military technology and new physics, suggesting their value to future researchers;</li>
<li>urges him to reconsider his views on Russia, claiming that the nation will ultimately save millions of Americans;</li>
<li>promises additional proof, including excerpts from their time machine’s manual and photographs of the vehicle.</li>
</ul>
<p>The fax continues to deepen the narrative, blending warnings about the future with a willingness to engage in further dialogue. This communication strengthens the foundation of what would later become the John Titor story.</p>
<h3><a name="p-126611-transcription-5" class="anchor" href="#p-126611-transcription-5" aria-label="Heading link"></a>Transcription</h3>
<blockquote>
<p>FAX TRANSMISSION <span class="hashtag-raw">#2</span><br>
—————————————<br>
From: ████████████████<br>
To: +1 (702) 555-7890<br>
Date: ████████<br>
Page: 1 of 1<br>
—————————————</p>
<p>Dear Mr. Bell,</p>
<p>I am glad you’re back. I faxed this information to you the day before you left the air. I wanted to make sure it wasn’t lost in the shuffle so I am sending a gift. If you’ve already seen this please accept my apologies. If you choose to make this public please do not publish the fax number. I had to fax when I heard the other time traveler calling in from the recent time past in fact the year 2500 Ad.</p>
<p>Let me explain, Mr. Bell. I sent a fax with this opening on July 29 1998. As I said then I am a time traveler. I have been on this world line since April of this year and I plan to leave soon. Typically time travelers do not purposely affect the world lines they visit. However, this mission is unusually long and I’ve grown attached to some of the people I have met here.</p>
<p>Anyway, for my own reasons I have decided to help this world line by sharing information about the future with a few people in the hope that it will help their future. I am contacting you for the same reason. Unfortunately there is no historical reference to your program in my worldline.</p>
<p>I believe you can change your future by creating one now.</p>
<p>Some of the information presented on your program may be invaluable to up-line researchers. I suggest you isolate the programs that concentrate on military technology and new physics theories. Transcribe these programs and put them someplace safe away from the box. I recommend someplace in the midwest.</p>
<p>I also urge you to reconsider your paranoia to the Russians.</p>
<p>They are not preparing for war with the average US citizen. They are preparing for war with the US government. They will eventually save this country and the lives of million of Americans.</p>
<p>I realize my claims are a bit difficult to accept so I will send the following once I know you have received this fax. A few pages from the operations manual of my time machine. And a few colored photographs of my vehicle.</p>
<p>If you wish to contact me I will be happy to share with you the nature of time, the physics of time travel and some of the events of your future.</p>
<p>Please send a return package to</p>
<p>██████████<br>
█████████████████<br>
███████████████<br>
█████</p>
</blockquote>
            </div>
