        <script type="application/json" id="data-preloaded">{"topic_14274":"{\"post_stream\":{\"posts\":[{\"id\":14275,\"name\":\"Paul\",\"username\":\"Paul\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/p/C9556F/{size}.png\",\"created_at\":\"2000-10-23T09:14:00.000Z\",\"cooked\":\"\\u003cp\\u003eM:\\\\Picture\\\\Untitled.GIF\\u003c/p\\u003e\\n\\u003cp\\u003eTHE PARADOXESÖ\\u003c/p\\u003e\\n\\u003cp\\u003eIf you went back in time and visited your granny during her ninth birthday donít kill her! Because if you put a gun to her head and pull the trigger she could not have given birth to your mum. YOU certainly were never bornÖ\\u003c/p\\u003e\\n\\u003cp\\u003eTherefore you could not have killed anyone as you never existed. Now this means your granny couldnít have been killed by you. She didnít die nine years old. This permits you to be born.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you were born could you go back and kill your granny? No, not your real granny. This general idea has been used in Back to the future. Marty nearly stops himself from being born when he prevents his parents from falling in love.\\u003c/p\\u003e\\n\\u003cp\\u003eSolving The Problem\\u003c/p\\u003e\\n\\u003cp\\u003e1, You simply canít change history meaning if you go back in time you have no free will(as shown in Twelve Monkeys, Crime Traveler etc. Events will get in your way if you try to kill your granny. YOU CANíT DO IT.\\u003c/p\\u003e\\n\\u003cp\\u003e2, When you so-called change history youíre actually moving up a different branch in time into another universe. The previous universe (where you were born) still exists. When you fire the gun youíre really killing another version of your grandmother.\\u003c/p\\u003e\\n\\u003cp\\u003e3, Any actions you make in the so-called past has no affects on the present. Itís a different time-line universe.\\u003c/p\\u003e\\n\\u003cp\\u003eThe laws true solutions donít present real time-travel as you go into another world.\\u003c/p\\u003e\\n\\u003cp\\u003eConclusion\\u003c/p\\u003e\\n\\u003cp\\u003eWe canít simply use the grandmother paradox to rule out time-travel claiming it causes logical inconsistencies. We need to look at all the possibilities.\\u003c/p\\u003e\\n\\u003cp\\u003eHow could we build a time machine?\\u003c/p\\u003e\\n\\u003cp\\u003eThe mathematics of general relativity suggest that under extreme conditions space-time might become so warped it would be possible to travel back in time. There is also the possibility of tunnels in time created by negative mass.\\u003c/p\\u003e\\n\\u003cp\\u003eVery long rotating cylinders of matter-proposed by Frank Tipler\\u003c/p\\u003e\\n\\u003cp\\u003eKerrís spinning blackholes-since most stars spin this becomes worth looking (proposed by Roy Kerr).\\u003c/p\\u003e\\n\\u003cp\\u003eCosmic strings-(as Richard Cott suggested)\\u003c/p\\u003e\\n\\u003cp\\u003eTravelling faster than light Ė would take us back in time(as suggested by solutions to relativity). Wormholes might allow us to outpace light (if you walk through the short cut quicker than light through convential (normal) space.\\u003c/p\\u003e\\n\\u003cp\\u003eTachyons -are sub-atomic particles which always travel faster than light and therefore move back in time constantly. They have not yet been found and remain hypethical.\\u003c/p\\u003e\\n\\u003cp\\u003eContracting Universe- Time might then be running backwards but since everything else also would itís unsuitable.\\u003c/p\\u003e\\n\\u003cp\\u003eMacro-wormholes(Kip Thorne showed how we could use it as a time machine).\\u003c/p\\u003e\\n\\u003cp\\u003etime - paradox\\u003c/p\\u003e\\n\\u003cp\\u003eParadoxes\\u003c/p\\u003e\\n\\u003cp\\u003eGrandfather paradox\\u003c/p\\u003e\\n\\u003cp\\u003eSuppose you could go back in time, lets say several decades and found your grandfather when he was two years old. In his house you could grab a knife and stab him to death. He doesn’t get the chance to have children with your grandmother. Therefore either your mother or father doesn’t get born. Your parents can’t give birth to you because one of them don’t exist. You could never have been born and don’t even exist. But could your grandfather have been killed by someone who doesn’t exist? He must have lived through his childhood. This would allow you to exist if this is the case. Seemingly you can go back in time to commit the murder if you are born but then you would never have been born. And so on and so on. This situation is not consistent with itself. It doesn’t make sense and can’t possibly happen.\\u003c/p\\u003e\\n\\u003cp\\u003eSolutions\\u003c/p\\u003e\\n\\u003cp\\u003e1, You simply can’t change the past. Time will stop you limiting your freedom while you’re in the past from your point of view. This puts the concept of freewill in serious danger especially if you tell people what’s going to happen to them in their future. If you believe when you go back in time you are from one possible future from everyone else’s point of view they can simply go up any root in time they want.\\u003c/p\\u003e\\n\\u003cp\\u003eAccording to quantum physics Many Worlds theory there are a huge amount of universes where every possibility occurs between them all. In some you’re the opposite sex. In some you won the lottery etc.\\u003c/p\\u003e\\n\\u003cp\\u003eYou might be heading towards the universe you originally came from before you travelled back in time. Everything will happen the way you remember it. But all the people you meet are free to decide what they want to do and enter a different universe. Since it’s not possible for you to be there you disappear from their lives. Meeting a time traveller from your future could therefore be very strange.\\u003c/p\\u003e\\n\\u003cp\\u003e2, A parallel universe might be created when you seem to change the past. Imagine if time itself was just like a tree. The different branches show different ways events could have happened. Every time we decide to do or not to do something time splits. Even if we are not aware we decided something it have affects. Quantum physics reveals a many worlds theory like this.\\u003c/p\\u003e\\n\\u003cp\\u003eConclusion\\u003c/p\\u003e\\n\\u003cp\\u003eSince this parallel universe is not really your past (despite it’s first appearance) anything you do there does not affect you. You can prevent a version of yourself from being born because you are not really related to anyone there. They just look very like your family and friends. You are not home! You may be somewhere that looks like the place you live but a different universe in quantum physics is a completely different reality.\\u003c/p\\u003e\\n\\u003cp\\u003e3, No matter what you do in what is really a parallel universe you will do back to your previous universe which is not affected by your previous actions. A space-time wormhole could lead you back to your original unaffected universe.\\u003c/p\\u003e\\n\\u003cp\\u003eWhat came out of the wormhole if the ball never went into it?\\u003c/p\\u003e\\n\\u003cp\\u003eAnother common example of a paradox is a ball that goes through a wormhole connected with a moment in the past. Therefore it comes out of the other space-time wormhole mouth actually before it went in! Then what might happen? If the ball then hits it’s younger self out of the way of the mouth then it never goes in. But if the ball never did go in the wormhole then how can it ever come out. The existence of the older version of the ball is destroyed i.e. it never falls back in time. But then this version certainly can’t hit the younger version out of the way. So it must go into the wormhole as a collision with it’s older self is evidently the only force that could and did stop the ball from entering the wormhole. This of course is unexplainable and is logically inconsistent.\\u003c/p\\u003e\\n\\u003cp\\u003eBut the situation could happen differently to allow it to become self consistent.\\u003c/p\\u003e\\n\\u003cp\\u003e1, What if after the ball comes out of the wormhole at an earlier time it does hit it’s previous self but this collision is what makes the ball fall into the mouth in the first place! It hits the other version into the mouth. This would imply that the past or present is affected by the future. In fact in this case the past is dependant on the future.\\u003c/p\\u003e\\n\\u003cp\\u003e2, The ball might simply hit it’s other self only slightly so the direction of the ball is not altered enough to cause a paradox.\\u003c/p\\u003e\\n\\u003cp\\u003e3, The ball might just miss it’s younger self.\\u003c/p\\u003e\\n\\u003cp\\u003eNature might protect time and prevent paradoxes. From theories and many stories it’s clear that paradoxes cannot happen in the real world.\\u003c/p\\u003e\\n\\u003cp\\u003eOther types of paradoxes\\u003c/p\\u003e\\n\\u003cp\\u003eIn the terminator movies John had something important to tell Sarah. Thank her for her help through the hell. Tell her not to give up or he will never exist.\\u003c/p\\u003e\\n\\u003cp\\u003eWho wrote the speech?\\u003c/p\\u003e\\n\\u003cp\\u003eJohn certainly didn’t write it. He was told it since he was a kid from Sarah who could remember it. Sarah just recalls what Kyle told her in 1984. Kyle just remembered what John told him to say.\\u003c/p\\u003e\\n\\u003cp\\u003eConclusion\\u003c/p\\u003e\\n\\u003cp\\u003eNo one wrote it. It exists somehow but not by John, Kyle or Sarah being creative. No one had to write it because it was created by the affect the future on the past had on each other.\\u003c/p\\u003e\\n\\u003cp\\u003eIf I in 2000 study the history of work done in a private factory and learn about the development of a time machine! Their scientists worked from designs and plans noted in a book (never published)they used. They had no idea how to achieve such technology until they read it.\\u003c/p\\u003e\\n\\u003cp\\u003eThen to experiment with temporal(time) paradoxes I am sent back to 1983. The entire building has not even been built as I arrive. Later accidentally I meet one of the scientists and talk to him. When I hear how excited he is I hand him that book which he uses future success. The answers! He is more than willing to read and use the book.\\u003c/p\\u003e\\n\\u003cp\\u003eBut who came up with the idea of how the time machine is built?\\u003c/p\\u003e\\n\\u003cp\\u003eNot any of the scientists as they just followed instructions in that book.\\u003c/p\\u003e\\n\\u003cp\\u003eNot me as all I did was hand a scientist a book. Noone actually wrote the book and no one had to work it out.\\u003c/p\\u003e\\n\\u003cp\\u003eIs this allowed by physical laws?\\u003c/p\\u003e\\n\\u003cp\\u003eNoone really knows…\\u003c/p\\u003e\",\"post_number\":1,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2026-09-06T15:52:35.099Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1138,\"reads\":43,\"readers_count\":42,\"score\":5683.6,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"Paul\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":4,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://timetravelinstitute.com/t/the-lost-original-john-titor-posts-and-their-whereabouts/14406/3\",\"internal\":true,\"reflection\":true,\"title\":\"Where are the original Titor posts?\",\"clicks\":5},{\"url\":\"https://timetravelinstitute.com/t/hello-im-john-titor/14480/124\",\"internal\":true,\"reflection\":true,\"title\":\"Hello, I'm John Titor\",\"clicks\":0},{\"url\":\"https://timetravelinstitute.com/t/an-italian-students-questions-on-titor-and-the-grandfather-paradox/14848/6\",\"internal\":true,\"reflection\":true,\"title\":\"Hello everyone\",\"clicks\":0},{\"url\":\"https://timetravelinstitute.com/t/an-italian-students-questions-on-titor-and-the-grandfather-paradox/14848/9\",\"internal\":true,\"reflection\":true,\"title\":\"Hello everyone\",\"clicks\":0},{\"url\":\"https://timetravelinstitute.com/t/time-travel-paradoxes-the-discussion-since-2014/19988\",\"internal\":true,\"reflection\":true,\"title\":\"Time-travel Paradoxes! — the discussion since 2014\",\"clicks\":0},{\"url\":\"https://timetravelinstitute.com/t/john-titor-the-original-posts-on-the-time-travel-institute-2000-2001/19725\",\"internal\":true,\"reflection\":true,\"title\":\"John Titor: The Original Posts on the Time Travel Institute (2000–2001)\",\"clicks\":0},{\"url\":\"https://timetravelinstitute.com/t/every-john-titor-post-timetravel-0-verified-complete-index/19981\",\"internal\":true,\"reflection\":true,\"title\":\"Every John Titor Post (TimeTravel_0), Verified: Complete Index\",\"clicks\":0}],\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":105,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/1\",\"event\":null,\"calendar_details\":[],\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null,\"can_vote\":false},{\"id\":88658,\"name\":\"NoTime\",\"username\":\"NoTime\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/n/5F86D9/{size}.png\",\"created_at\":\"2000-10-23T17:06:00.000Z\",\"cooked\":\"\\u003cp\\u003eThere is no grandfather paradox in the multiverse scenario. In a multiverse, your grandfather’s multiple histories included many in which he was not murdered and many in which he was murdered.\\u003c/p\\u003e\\n\\u003cp\\u003eThose many histories in which he was murdered included some involving different male or female murderers who killed him. It’s possible that you were one of those murderers in one of your previous lifetimes or incarnations.\\u003c/p\\u003e\",\"post_number\":2,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:28.405Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":32,\"readers_count\":31,\"score\":11.4,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"NoTime\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":2029,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/2\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88659,\"name\":\"Shadow\",\"username\":\"Shadow\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/s/7B838E/{size}.png\",\"created_at\":\"2000-10-25T02:37:00.000Z\",\"cooked\":\"\\u003cp\\u003eParadox can’t hold a candle to “twinadox”. Thats when you time travel back and MARRY your gradndmother and become your own grandpaw. What if you had a twin brother and the THREE of you all show up one day, wich one is the other you? How do you know that there shouldn’t be four of you and somebodys missing? Cheesh man!! I’m going to get some sleep, and try not to read this thread next time…er wait a minute, on the other hand…the me in a paralell reality may infulence me to change my mind…\\u003c/p\\u003e\",\"post_number\":3,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:28.530Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":2,\"reads\":29,\"readers_count\":28,\"score\":15.8,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"Shadow\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://timetravelinstitute.com/t/time-travel-paradoxes-the-discussion-since-2014/19988/78\",\"internal\":true,\"reflection\":true,\"title\":\"Time-travel Paradoxes! — the discussion since 2014\",\"clicks\":0}],\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":204,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/3\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88660,\"name\":\"1.21 Jiga-watts\",\"username\":\"1.21_Jiga-watts\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/1/C9556F/{size}.png\",\"created_at\":\"2000-10-25T20:05:00.000Z\",\"cooked\":\"\\u003cp\\u003eLet’s get away from travelling to the past for a moment. Let’s look at what was made popular in Back to the Future pt 2, where Marty sees his son, or his girlfriend sees herself.\\u003c/p\\u003e\\n\\u003cp\\u003eIt cannot happen! If you left time, you would be considered ‘missing’, or dead. The truth is, you don’t exist from the point in which you lept forward in time. You therefore cannot see yourself, or your son, because you stopped existing at that point in the past where you left.\\u003c/p\\u003e\\n\\u003cp\\u003eIs this a proper paradox? Is there any reasoning I am missing that says you can see your future self?\\u003c/p\\u003e\\n\\u003cp\\u003eLook forward to responses.\\u003c/p\\u003e\\n\\u003cp\\u003e1.21 Jiga-watts\\u003c/p\\u003e\",\"post_number\":4,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:28.638Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":29,\"readers_count\":28,\"score\":25.8,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"1.21 Jiga-watts\",\"primary_group_name\":\"legacy_guests\",\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"Original board guest\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":8649,\"hidden\":false,\"trust_level\":0,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/4\",\"event\":null,\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":1}],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88661,\"name\":\"NoTime\",\"username\":\"NoTime\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/n/5F86D9/{size}.png\",\"created_at\":\"2000-10-25T20:32:00.000Z\",\"cooked\":\"\\u003cp\\u003eTrue. If you leave this time, you will not be here until you return. But, if you are aive in the future as you were alive in the past, then you could visit yourself because you are there. Your present self is different from your past or future self. This definitely applies to the past because you know you lived in the past and if you can go there, then you can visit yourself.\\u003c/p\\u003e\",\"post_number\":5,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:28.804Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":27,\"readers_count\":26,\"score\":10.4,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"NoTime\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":2029,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/5\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88662,\"name\":\"Crono\",\"username\":\"Crono\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/c/A468C6/{size}.png\",\"created_at\":\"2000-10-25T21:52:00.000Z\",\"cooked\":\"\\u003cp\\u003eI think there is two ways to look at this Jiga Watts. The first one is where you can actually change the past so it effects the future. If you were presumed dead in the future, then you could go back to the time right after you left and nothing would have been changed. However if you leave again, it will just be the same as before.\\u003c/p\\u003e\\n\\u003cp\\u003eThe second one is where you can’t change the past, and you’ll only be creating a parallel universe. What used to be your future is now your present, and since what used to be your present is now your past, you can’t change the past, so you’ll still be presumed dead at when you left off. And so you can still go back in the past and live there as usual, you won’t be changing the future.\\u003c/p\\u003e\\n\\u003cp\\u003eI think that’s how those theories go.\\u003c/p\\u003e\",\"post_number\":6,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:28.965Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":7,\"reads\":28,\"readers_count\":27,\"score\":40.6,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"Crono\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":101,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/6\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88663,\"name\":\"Paul\",\"username\":\"Paul\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/p/C9556F/{size}.png\",\"created_at\":\"2000-10-26T10:27:00.000Z\",\"cooked\":\"\\u003cp\\u003eIt is very interesting what would happen if you left the present and reached the future. In The Time Machine the time travelers asks about himself and people claim he went missing when he left on his journey through time.\\u003cbr\\u003e\\nIt seems like an BTTF2 Marty was taken away in 1985 so his kids and everything couldn’t exist in 2015…\\u003cbr\\u003e\\nBut the existance of his kids might just be evidence that they will later return to 1985 to do all those things! This would imply that everything they are going to do have already been decided!\\u003cbr\\u003e\\nIt became clear the the future is NOT set as Doc claimed the future hasn’t been written yet. So how could they travel into what does not exist? Even when Marty went to 1955 he must have been from the future from some people’s point of view?\\u003cbr\\u003e\\nThe future they travelled to might just have been one possible future! In the quantum many worlds theory there are an infinite amount of futures where every possibility occurs…\\u003c/p\\u003e\",\"post_number\":7,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:29.118Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":11,\"reads\":27,\"readers_count\":26,\"score\":60.4,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"Paul\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":105,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/7\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88664,\"name\":\"Cocurious\",\"username\":\"Cocurious\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/c/A468C6/{size}.png\",\"created_at\":\"2000-10-26T12:16:00.000Z\",\"cooked\":\"\\u003cp\\u003eIn response to 1.21 jiga-watts. If you go into the future and see yourself, then by rights you will succeed in whatever you are doing in the future, and make it back to the present. If you don’t see yourself, then one could asume that you never made it back to your own time in the present.\\u003c/p\\u003e\",\"post_number\":8,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:29.227Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":26,\"readers_count\":25,\"score\":10.2,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"Cocurious\",\"primary_group_name\":\"legacy_guests\",\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"Original board guest\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":8216,\"hidden\":false,\"trust_level\":0,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/8\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88665,\"name\":\"NoTime\",\"username\":\"NoTime\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/n/5F86D9/{size}.png\",\"created_at\":\"2000-10-26T17:22:00.000Z\",\"cooked\":\"\\u003cp\\u003eIn some probabilities, you traveled to the future and made it back, in others you did not make it back. In some probabilities you are alive in a future time and in others you are not alive. A multiverse contains all possibilities and all combinations of possibilities.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you can travel to the future, you can meet a future self or not, depending on which probable future you go to.\\u003c/p\\u003e\",\"post_number\":9,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:29.356Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":27,\"readers_count\":26,\"score\":10.4,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"NoTime\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":2029,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/9\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reac ’s a fascinating discussion, to be sure, and one that seemingly has endless possibilities.\\u003c/p\\u003e\\n\\u003cp\\u003eI’m pretty set on the paradox I raised, however. It just doesn’t seem possible that you can see your future self.\\u003c/p\\u003e\\n\\u003cp\\u003eI’ll check in every now and then. Continue in your hypothesizing!\\u003c/p\\u003e\\n\\u003cp\\u003e1.21 Jiga-Watts\\u003c/p\\u003e\",\"post_number\":11,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:29.561Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":12,\"reads\":28,\"readers_count\":27,\"score\":60.6,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"1.21 Jiga-watts\",\"primary_group_name\":\"legacy_guests\",\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"Original board guest\",\"title_is_group\":true,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":8649,\"hidden\":false,\"trust_level\":0,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/11\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88668,\"name\":\"TimeTravel_0\",\"username\":\"TimeTravel_0\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/timetravel_0/{size}/239_2.png\",\"created_at\":\"2000-11-02T06:16:00.000Z\",\"cooked\":\"\\u003cp\\u003eWow! Paul is right on the money. I was just about to reated_at\":\"2000-11-03T00:09:00.000Z\",\"cooked\":\"\\u003cp\\u003eTime Travel_0- “confirming”.\\u003c/p\\u003e\\n\\u003cp\\u003eDymenzionz-   \\u003cimg src=\\\"https://timetravelinstitute.com/images/emoji/twemoji/slight_smile.png?v=15\\\" title=\\\":slight_smile:\\\" class=\\\"emoji\\\" alt=\\\":slight_smile:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e  HI!!! Good to see ya back!\\u003c/p\\u003e\\n\\u003cp\\u003esincerely,\\u003cbr\\u003e\\npamela\\u003c/p\\u003e\",\"post_number\":18,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2026-10-01T04:23:21.782Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":83,\"reads\":23,\"readers_count\":22,\"score\":419.6,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"pamela\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":16,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/18\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88675,\"name\":\"pamela\",\"username\":\"pamela\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/pamela/{size}/6253_2.png\",\"created_at\":\"2000-11-04T10:24:00.000Z\",\"cooked\":\"\\u003cp\\u003eTimeTravel_0-\\u003cbr\\u003e\\nyour pictures are posted as promised and can be found here:\\u003cbr\\u003e\\n\\u003ca href=\\\"http://pub2.ezboard.com/bmagisystems\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttp://pub2.ezboard.com/bmagisystems\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eclick on the topic- timelords anonymous\\u003cbr\\u003e\\nand it is titled: anonymus gravity/time device pictures.\\u003c/p\\u003e\\n\\u003cp\\u003esincerely,\\u003cbr\\u003e\\npamela\\u003c/p\\u003e\\n\\u003cp\\u003eTHANKS DOC!   \\u003cimg src=\\\"https://timetravelinstitute.com/images/emoji/twemoji/slight_smile.png?v=15\\\" title=\\\":slight_smile:\\\" class=\\\"emoji\\\" alt=\\\":slight_smile:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003c/p\\u003e\",\"post_number\":19,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2026-10-01T04:23:22.026Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":166,\"reads\":24,\"readers_count\":23,\"score\":834.8,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"pamela\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"http://pub2.ezboard.com/bmagisystems\",\"internal\":false,\"reflection\":false,\"clicks\":151}],\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":16,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/19\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":88676,\"name\":\"pamela\",\"username\":\"pamela\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/pamela/{size}/6253_2.png\",\"created_at\":\"2000-11-05T09:29:00.000Z\",\"cooked\":\"\\u003cp\\u003eQuestions for timetravel_0 with permission to post.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela:\\u003cbr\\u003e\\nby the way can you tell me what it feels like to time travel? when you are\\u003cbr\\u003e\\nin the process of doing it what does it feel like and what do you see and\\u003cbr\\u003e\\nhear. you made mention that you had to get use to the fields. Do you see a\\u003cbr\\u003e\\nbright flash of light?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0:\\u003cbr\\u003e\\nInteresting first question. The unit has a ramp up time after the\\u003cbr\\u003e\\ndestination coordinates are fed into the computers. An audible alarm and a\\u003cbr\\u003e\\nsmall light start a short countdown at which point you should be secured in\\u003cbr\\u003e\\na seat. The gravity field generated by the unit overtakes you very quickly.\\u003cbr\\u003e\\nYou feel a tug toward the unit similar to rising quickly in an elevator and\\u003cbr\\u003e\\nit continues to rise based on the power setting the unit is working under.\\u003cbr\\u003e\\nAt 100% power, the constant pull of gravity can be as high as 2 Gs or more\\u003cbr\\u003e\\ndepending on how close you are to the unit. There are no serious side\\u003cbr\\u003e\\neffects but I try to avoid eating before a flight.\\u003c/p\\u003e\\n\\u003cp\\u003eNo bright flash of light is seen. Outside, the vehicle appears to\\u003cbr\\u003e\\naccelerate as the light is bent around it. We have to wear sunglasses or\\u003cbr\\u003e\\nclose our eyes as this happens due to a short burst of ultraviolet\\u003cbr\\u003e\\nradiation. Personally I think it looks like your driving under a rainbow.\\u003cbr\\u003e\\nAfter that, it appears to fade to black and remains totally black until the\\u003cbr\\u003e\\nunit is turned off. We are advised to keep the windows closed as a great\\u003cbr\\u003e\\ndeal of heat builds up outside the car. The gravity field also traps a\\u003cbr\\u003e\\nsmall air pocket around the car that acts as your only O2 supply unless you\\u003cbr\\u003e\\nbring compressed air with you. This pocket will only last for a short\\u003cbr\\u003e\\nperiod and a carbon sensor tells us when it’s too dangerous. The C204 unit\\u003cbr\\u003e\\nis accurate from 50 to 60 years a jump and travels at about 10 years an hour\\u003cbr\\u003e\\nat 100% power.\\u003c/p\\u003e\\n\\u003cp\\u003eYou do hear a slight hum as the unit operates and when the power changes or\\u003cbr\\u003e\\nthe unit turns off. There is a great deal of electrical crackling noise\\u003cbr\\u003e\\nfrom static electricity.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 1. what are some of your memories of 2036?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: I remember 2036 very clearly. It is difficult to describe 2036 in detail\\u003cbr\\u003e\\nwithout spending a great deal of time explaining why things are so\\u003cbr\\u003e\\ndifferent. In 2036, I live in central Florida with my family and I’m\\u003cbr\\u003e\\ncurrently stationed at an Army base in Tampa. A world war in 2015 killed\\u003cbr\\u003e\\nnearly three billion people. The people that survived grew closer together.\\u003cbr\\u003e\\nLife is centered around the family and then the community. I can not\\u003cbr\\u003e\\nimagine living even a few hundred miles away from my parents. There is no\\u003cbr\\u003e\\nlarge industrial complex creating masses of useless food and recreational\\u003cbr\\u003e\\nitems. Food and livestock is grown and sold locally. People spend much more\\u003cbr\\u003e\\ntime reading and talking together face to face. Religion is taken seriously\\u003cbr\\u003e\\nand everyone can multiple and divide in the heads.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 2. can you send me more of the manual?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: I will considering it but I do not expect they are worth anything to most\\u003cbr\\u003e\\npeople except as a curiosity.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 3.what would happen if you would meet yourself on another world line?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: It has always surprised me why that concept is so hard for people to imagine\\u003cbr\\u003e\\nand accept. Nothing would happen. The universe would not end and there are\\u003cbr\\u003e\\nno paradox problems that threaten existence. Temporal space-time is made up\\u003cbr\\u003e\\nof every possible quantum state. The Everett Wheeler model is correct. I\\u003cbr\\u003e\\nhave met and/or seen myself twice on different world lines. The first was a\\u003cbr\\u003e\\ntraining mission and the second is now. I was born in 1998 so the other\\u003cbr\\u003e\\n“me” is 2 on this world line. There is a saying where I come from…Every\\u003cbr\\u003e\\npossible thing that can happen or will happen has already happened\\u003cbr\\u003e\\nsomewhere.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 4.How is this world line different from your own?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: For starters…the fact that I’m here makes it different. I’ve also\\u003cbr\\u003e\\nnoticed little things like news events that happen at different times,\\u003cbr\\u003e\\nfootball games won by other teams…things like that. I would guess the\\u003cbr\\u003e\\ntemporal divergence between this world line and my original is about 1 or 2\\u003cbr\\u003e\\npercent. Of course, the longer I am here, the larger that divergence\\u003cbr\\u003e\\nbecomes from my point of view.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 5.Is the vehicle a jeep?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: No…its a 1967 Chevrolet..\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 6.Are you having normal dreams right now? any out of body experiences?\\u003cbr\\u003e\\ndrawing you to different times? Do you dream you wake up in other places\\u003cbr\\u003e\\nand other times?\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0: No strange dreams or other experiences. Everything is pretty much the way I\\u003cbr\\u003e\\nexpected it.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 7.are you able to control where you go or is it random?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: Yes, it can be controlled. However, the distortion unit has operational\\u003cbr\\u003e\\nlimits. Imagine your path through time is through a cone. The farther away\\u003cbr\\u003e\\nfrom the center of the cone, the more differences you will see in the world\\u003cbr\\u003e\\nline. The C204 begins to “break away” at about 60 years. This means the\\u003cbr\\u003e\\nlevel of confidence drops rapidly after 60 years of travel and the world\\u003cbr\\u003e\\nline divergence increases. In other words, if I wanted to go back 2000\\u003cbr\\u003e\\nyears and meet Christ, there is a better than average chance I would end up\\u003cbr\\u003e\\non a world line where he was never born. The computer units and gravity\\u003cbr\\u003e\\nsensors “record” your trip and you are quite easily able to return to your\\u003cbr\\u003e\\npoint of origin. I am aware that research is being done on faster units\\u003cbr\\u003e\\nwith more accurate clocks. I imagine that they will be able to go back\\u003cbr\\u003e\\nfarther with a higher degree of divergence confidence.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 8. are you feeling drawn back to your own time or are you stable in this\\u003cbr\\u003e\\nworld?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: I’m not sure what you mean by stable. If you mean mentally…there are many\\u003cbr\\u003e\\nthings that bother me here but being with my parents right now is important\\u003cbr\\u003e\\nto me. Physically, the only thing really wrong is the number of colds I\\u003cbr\\u003e\\nget.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 9.Are you able to go back to your own world line?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: Yes.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 10.how are you protecting yourself from radiation? it alters DNA if you\\u003cbr\\u003e\\ndont.\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: I’m not sure what radiation you mean. If you mean from the unit, you can\\u003cbr\\u003e\\nsee it vents X-rays and Gamma radiation out of the rear. As long as you\\u003cbr\\u003e\\nstay away from that, you should be okay. I keep a radiation detector with\\u003cbr\\u003e\\nme to check my environment and make sure the unit isn’t “leaking”.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 11.How long would you say that ultraviolet radiation lasts? about 10\\u003cbr\\u003e\\nseconds?\\u003cbr\\u003e\\nand when you are in that light can you see anything around you or does the\\u003cbr\\u003e\\nlight kind of “fill up” everything and that is all you can see at the\\u003cbr\\u003e\\ntime?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: The light bending only lasts a second. Its like driving under a tunnel and\\u003cbr\\u003e\\nbeing in total black.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 12.Do your people know where you are right now? Can you communicate with\\u003cbr\\u003e\\nthem?\\u003cbr\\u003e\\ndo you have a biological implant?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: No. They do not know where I am and I can not communicate with them.\\u003cbr\\u003e\\nInteresting idea though. From their point of view, I will return almost\\u003cbr\\u003e\\nexactly at the same moment I left. From their viewpoint, I will only have\\u003cbr\\u003e\\naged more than expected.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 13. after the flash of light is gone are you then in another time? what\\u003cbr\\u003e\\ndoes it look like as the new time unfolds? Is it just there? or does it\\u003cbr\\u003e\\nslowly come into view? does it fade in and out for a time?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: While the machine is on. Everything is black. When the machine is turned\\u003cbr\\u003e\\noff, it is the reverse affect. It appears you are driving out from a\\u003cbr\\u003e\\nbridge. To tell you the truth, I’m usually sleeping when the unit turns off\\u003cbr\\u003e\\nbut yes…it does appear that the world fades in from black.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 14. what happens if the device messes up?\\u003cbr\\u003e\\nDo you end up in space? if it goes offline and shifts ? does a hole open\\u003cbr\\u003e\\nelsewhere?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: Good question!!! That one almost never comes up. The hard part of\\u003cbr\\u003e\\ntraveling through time is not the bending of gravity but the plotting of\\u003cbr\\u003e\\nyour course and holding to the basic “position” in your environment. This\\u003cbr\\u003e\\nis done through a system called VGL (variable gravity lock). Basically, the\\u003cbr\\u003e\\nunit takes a reading of the local gravity and samples it during the “trip”\\u003cbr\\u003e\\nin pulses. If the gravity is too far off, the unit stops or reverses itself\\u003cbr\\u003e\\nto the last sample period where the readings were correct. If there is some\\u003cbr\\u003e\\nsort of failure, the unit shuts down and drops out to where ever you may be.\\u003c/p\\u003e\\n\\u003cp\\u003ePamela: 15. what affects are caused on the immediate area where the gravity has\\u003cbr\\u003e\\nbeen distorted after you leave it and when you arrive? are there permanent\\u003cbr\\u003e\\neffects left on the land such as electromagnetic disturbances in that\\u003cbr\\u003e\\narea?\\u003c/p\\u003e\\n\\u003cp\\u003eTimetravel_0: Another good question!!! The only real physical trace is a large chunk of\\u003cbr\\u003e\\nground missing from the point of origin and a large pile of dirt at the\\u003cbr\\u003e\\ndestination. The gravity field surrounds a small portion of the earth under\\u003cbr\\u003e\\nyou and takes it along for the ride. There is really no way around this.\\u003c/p\\u003e\\n\\u003cp\\u003ePlease feel free to post these if you wish.\\u003c/p\\u003e\",\"post_number\":20,\"post_type\":1,\"posts_count\":411,\"updated_at\":\"2025-07-18T01:24:30.749Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":38,\"reads\":27,\"readers_count\":26,\"score\":240.4,\"yours\":false,\"topic_id\":14274,\"topic_slug\":\"time-travel-paradoxes\",\"display_username\":\"pamela\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://timetravelinstitute.com/t/quantum-sub-geometry-crystallization-and-the-physical-basis-of-temporal-displacement/19365/4\",\"internal\":true,\"reflection\":true,\"title\":\"Quantum sub-geometry and a physical basis for temporal displacement\",\"clicks\":3}],\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":3}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":16,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/time-travel-paradoxes/14274/20\",\"event\":null,\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":1}],\"current_user_reaction\":null,\"reaction_users_count\":3,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null}],\"stream\":[14275,88658,88659,88660,88661,88662,88663,88664,88665,88666,88667,88668,88669,88670,88671,88672,88673,88674,88675,88676,88677,88678,88679,88680,88681,88682,88683,88684,88685,88686,88687,88688,88689,88690,88691,88692,88693,88694,88695,88696,88697,88698,88699,88700,88701,88702,88703,88704,88705,88706,88707,88708,88709,88710,88711,88712,88713,88714,88715,88716,88717,88718,88719,88720,8872 <p>THE PARADOXESÖ</p>
<p>If you went back in time and visited your granny during her ninth birthday donít kill her! Because if you put a gun to her head and pull the trigger she could not have given birth to your mum. YOU certainly were never bornÖ</p>
<p>Therefore you could not have killed anyone as you never existed. Now this means your granny couldnít have been killed by you. She didnít die nine years old. This permits you to be born.</p>
<p>If you were born could you go back and kill your granny? No, not your real granny. This general idea has been used in Back to the future. Marty nearly stops himself from being born when he prevents his parents from falling in love.</p>
<p>Solving The Problem</p>
<p>1, You simply canít change history meaning if you go back in time you have no free will(as shown in Twelve Monkeys, Crime Traveler etc. Events will get in your way if you try to kill your granny. YOU CANíT DO IT.</p>
<p>2, When you so-called change history youíre actually moving up a different branch in time into another universe. The previous universe (where you were born) still exists. When you fire the gun youíre really killing another version of your grandmother.</p>
<p>3, Any actions you make in the so-called past has no affects on the present. Itís a different time-line universe.</p>
<p>The laws true solutions donít present real time-travel as you go into another world.</p>
<p>Conclusion</p>
<p>We canít simply use the grandmother paradox to rule out time-travel claiming it causes logical inconsistencies. We need to look at all the possibilities.</p>
<p>How could we build a time machine?</p>
<p>The mathematics of general relativity suggest that under extreme conditions space-time might become so warped it would be possible to travel back in time. There is also the possibility of tunnels in time created by negative mass.</p>
<p>Very long rotating cylinders of matter-proposed by Frank Tipler</p>
<p>Kerrís spinning blackholes-since most stars spin this becomes worth looking (proposed by Roy Kerr).</p>
<p>Cosmic strings-(as Richard Cott suggested)</p>
<p>Travelling faster than light Ė would take us back in time(as suggested by solutions to relativity). Wormholes might allow us to outpace light (if you walk through the short cut quicker than light through convential (normal) space.</p>
<p>Tachyons -are sub-atomic particles which always travel faster than light and therefore move back in time constantly. They have not yet been found and remain hypethical.</p>
<p>Contracting Universe- Time might then be running backwards but since everything else also would itís unsuitable.</p>
<p>Macro-wormholes(Kip Thorne showed how we could use it as a time machine).</p>
<p>time - paradox</p>
<p>Paradoxes</p>
<p>Grandfather paradox</p>
<p>Suppose you could go back in time, lets say several decades and found your grandfather when he was two years old. In his house you could grab a knife and stab him to death. He doesn’t get the chance to have children with your grandmother. Therefore either your mother or father doesn’t get born. Your parents can’t give birth to you because one of them don’t exist. You could never have been born and don’t even exist. But could your grandfather have been killed by someone who doesn’t exist? He must have lived through his childhood. This would allow you to exist if this is the case. Seemingly you can go back in time to commit the murder if you are born but then you would never have been born. And so on and so on. This situation is not consistent with itself. It doesn’t make sense and can’t possibly happen.</p>
<p>Solutions</p>
<p>1, You simply can’t change the past. Time will stop you limiting your freedom while you’re in the past from your point of view. This puts the concept of freewill in serious danger especially if you tell people what’s going to happen to them in their future. If you believe when you go back in time you are from one possible future from everyone else’s point of view they can simply go up any root in time they want.</p>
<p>According to quantum physics Many Worlds theory there are a huge amount of universes where every possibility occurs between them all. In some you’re the opposite sex. In some you won the lottery etc.</p>
<p>You might be heading towards the universe you originally came from before you travelled back in time. Everything will happen the way you remember it. But all the people you meet are free to decide what they want to do and enter a different universe. Since it’s not possible for you to be there you disappear from their lives. Meeting a time traveller from your future could therefore be very strange.</p>
<p>2, A parallel universe might be created when you seem to change the past. Imagine if time itself was just like a tree. The different branches show different ways events could have happened. Every time we decide to do or not to do something time splits. Even if we are not aware we decided something it have affects. Quantum physics reveals a many worlds theory like this.</p>
<p>Conclusion</p>
<p>Since this parallel universe is not really your past (despite it’s first appearance) anything you do there does not affect you. You can prevent a version of yourself from being born because you are not really related to anyone there. They just look very like your family and friends. You are not home! You may be somewhere that looks like the place you live but a different universe in quantum physics is a completely different reality.</p>
<p>3, No matter what you do in what is really a parallel universe you will do back to your previous universe which is not affected by your previous actions. A space-time wormhole could lead you back to your original unaffected universe.</p>
<p>What came out of the wormhole if the ball never went into it?</p>
<p>Another common example of a paradox is a ball that goes through a wormhole connected with a moment in the past. Therefore it comes out of the other space-time wormhole mouth actually before it went in! Then what might happen? If the ball then hits it’s younger self out of the way of the mouth then it never goes in. But if the ball never did go in the wormhole then how can it ever come out. The existence of the older version of the ball is destroyed i.e. it never falls back in time. But then this version certainly can’t hit the younger version out of the way. So it must go into the wormhole as a collision with it’s older self is evidently the only force that could and did stop the ball from entering the wormhole. This of course is unexplainable and is logically inconsistent.</p>
<p>But the situation could happen differently to allow it to become self consistent.</p>
<p>1, What if after the ball comes out of the wormhole at an earlier time it does hit it’s previous self but this collision is what makes the ball fall into the mouth in the first place! It hits the other version into the mouth. This would imply that the past or present is affected by the future. In fact in this case the past is dependant on the future.</p>
<p>2, The ball might simply hit it’s other self only slightly so the direction of the ball is not altered enough to cause a paradox.</p>
<p>3, The ball might just miss it’s younger self.</p>
<p>Nature might protect time and prevent paradoxes. From theories and many stories it’s clear that paradoxes cannot happen in the real world.</p>
<p>Other types of paradoxes</p>
<p>In the terminator movies John had something important to tell Sarah. Thank her for her help through the hell. Tell her not to give up or he will never exist.</p>
<p>Who wrote the speech?</p>
<p>John certainly didn’t write it. He was told it since he was a kid from Sarah who could remember it. Sarah just recalls what Kyle told her in 1984. Kyle just remembered what John told him to say.</p>
<p>Conclusion</p>
<p>No one wrote it. It exists somehow but not by John, Kyle or Sarah being creative. No one had to write it because it was created by the affect the future on the past had on each other.</p>
<p>If I in 2000 study the history of work done in a private factory and learn about the development of a time machine! Their scientists worked from designs and plans noted in a book (never published)they used. They had no idea how to achieve such technology until they read it.</p>
<p>Then to experiment with temporal(time) paradoxes I am sent back to 1983. The entire building has not even been built as I arrive. Later accidentally I meet one of the scientists and talk to him. When I hear how excited he is I hand him that book which he uses future success. The answers! He is more than willing to read and use the book.</p>
<p>But who came up with the idea of how the time machine is built?</p>

            <div class='post' itemprop="text">
              <p>Let’s get away from travelling to the past for a moment. Let’s look at what was made popular in Back to the Future pt 2, where Marty sees his son, or his girlfriend sees herself.</p>
<p>It cannot happen! If you left time, you would be considered ‘missing’, or dead. The truth is, you don’t exist from the point in which you lept forward in time. You therefore cannot see yourself, or your son, because you stopped existing at that point in the past where you left.</p>
<p>Is this a proper paradox? Is there any reasoning I am missing that says you can see your future self?</p>

              <p>True. If you leave this time, you will not be here until you return. But, if you are aive in the future as you were alive in the past, then you could visit yourself because you are there. Your present self is different from your past or future self. This definitely applies to the past because you know you lived in the past and if you can go there, then you can visit yourself.</p>

            <div class='post' itemprop="text">
              <p>I think there is two ways to look at this Jiga Watts. The first one is where you can actually change the past so it effects the future. If you were presumed dead in the future, then you could go back to the time right after you left and nothing would have been changed. However if you leave again, it will just be the same as before.</p>
<p>The second one is where you can’t change the past, and you’ll only be creating a parallel universe. What used to be your future is now your present, and since what used to be your present is now your past, you can’t change the past, so you’ll still be presumed dead at when you left off. And so you can still go back in the past and live there as usual, you won’t be changing the future.</p>
<p>I think that’s how those theories go.</p>

          <div id='post_20' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://timetravelinstitute.com/u/pamela'><span itemprop="name">pamela</span></a>
                  <meta itemprop='url' content='https://timetravelinstitute.com/u/pamela'>

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2000-11-05T09:29:00Z' class='post-time'>
                    November 5, 2000,  9:29am
                  </time>
                  <meta itemprop='dateModified' content='2000-11-05T09:29:00Z'>

            <div class='post' itemprop="text">
              <p>Questions for timetravel_0 with permission to post.</p>
<p>Pamela:<br>
by the way can you tell me what it feels like to time travel? when you are<br>
in the process of doing it what does it feel like and what do you see and<br>
hear. you made mention that you had to get use to the fields. Do you see a<br>
bright flash of light?</p>
<p>Timetravel_0:<br>
Interesting first question. The unit has a ramp up time after the<br>
destination coordinates are fed into the computers. An audible alarm and a<br>
small light start a short countdown at which point you should be secured in<br>
a seat. The gravity field generated by the unit overtakes you very quickly.<br>
You feel a tug toward the unit similar to rising quickly in an elevator and<br>
it continues to rise based on the power setting the unit is working under.<br>
At 100% power, the constant pull of gravity can be as high as 2 Gs or more<br>
depending on how close you are to the unit. There are no serious side<br>
effects but I try to avoid eating before a flight.</p>
<p>No bright flash of light is seen. Outside, the vehicle appears to<br>
accelerate as the light is bent around it. We have to wear sunglasses or<br>
close our eyes as this happens due to a short burst of ultraviolet<br>
radiation. Personally I think it looks like your driving under a rainbow.<br>
After that, it appears to fade to black and remains totally black until the<br>
unit is turned off. We are advised to keep the windows closed as a great<br>
deal of heat builds up outside the car. The gravity field also traps a<br>
small air pocket around the car that acts as your only O2 supply unless you<br>
bring compressed air with you. This pocket will only last for a short<br>
period and a carbon sensor tells us when it’s too dangerous. The C204 unit<br>
is accurate from 50 to 60 years a jump and travels at about 10 years an hour<br>
at 100% power.</p>
<p>You do hear a slight hum as the unit operates and when the power changes or<br>
the unit turns off. There is a great deal of electrical crackling noise<br>
from static electricity.</p>
<p>Pamela: 1. what are some of your memories of 2036?</p>
<p>Timetravel_0: I remember 2036 very clearly. It is difficult to describe 2036 in detail<br>
without spending a great deal of time explaining why things are so<br>
different. In 2036, I live in central Florida with my family and I’m<br>
currently stationed at an Army base in Tampa. A world war in 2015 killed<br>
nearly three billion people. The people that survived grew closer together.<br>
Life is centered around the family and then the community. I can not<br>
imagine living even a few hundred miles away from my parents. There is no<br>
large industrial complex creating masses of useless food and recreational<br>
items. Food and livestock is grown and sold locally. People spend much more<br>
time reading and talking together face to face. Religion is taken seriously<br>
and everyone can multiple and divide in the heads.</p>
<p>Pamela: 2. can you send me more of the manual?</p>
<p>Timetravel_0: I will considering it but I do not expect they are worth anything to most<br>
people except as a curiosity.</p>
<p>Pamela: 3.what would happen if you would meet yourself on another world line?</p>
<p>Timetravel_0: It has always surprised me why that concept is so hard for people to imagine<br>
and accept. Nothing would happen. The universe would not end and there are<br>
no paradox problems that threaten existence. Temporal space-time is made up<br>
of every possible quantum state. The Everett Wheeler model is correct. I<br>
have met and/or seen myself twice on different world lines. The first was a<br>
training mission and the second is now. I was born in 1998 so the other<br>
“me” is 2 on this world line. There is a saying where I come from…Every<br>
possible thing that can happen or will happen has already happened<br>
somewhere.</p>
<p>Pamela: 4.How is this world line different from your own?</p>
<p>Timetravel_0: For starters…the fact that I’m here makes it different. I’ve also<br>
noticed little things like news events that happen at different times,<br>
football games won by other teams…things like that. I would guess the<br>
temporal divergence between this world line and my original is about 1 or 2<br>
percent. Of course, the longer I am here, the larger that divergence<br>
becomes from my point of view.</p>
<p>Pamela: 5.Is the vehicle a jeep?</p>
<p>Timetravel_0: No…its a 1967 Chevrolet..</p>
<p>Pamela: 6.Are you having normal dreams right now? any out of body experiences?<br>
drawing you to different times? Do you dream you wake up in other places<br>
and other times?</p>
<p>TimeTravel_0: No strange dreams or other experiences. Everything is pretty much the way I<br>
expected it.</p>
<p>Pamela: 7.are you able to control where you go or is it random?</p>
<p>Timetravel_0: Yes, it can be controlled. However, the distortion unit has operational<br>
limits. Imagine your path through time is through a cone. The farther away<br>
from the center of the cone, the more differences you will see in the world<br>
line. The C204 begins to “break away” at about 60 years. This means the<br>
level of confidence drops rapidly after 60 years of travel and the world<br>
line divergence increases. In other words, if I wanted to go back 2000<br>
years and meet Christ, there is a better than average chance I would end up<br>
on a world line where he was never born. The computer units and gravity<br>
sensors “record” your trip and you are quite easily able to return to your<br>
point of origin. I am aware that research is being done on faster units<br>
with more accurate clocks. I imagine that they will be able to go back<br>
farther with a higher degree of divergence confidence.</p>
<p>Pamela: 8. are you feeling drawn back to your own time or are you stable in this<br>
world?</p>
<p>Timetravel_0: I’m not sure what you mean by stable. If you mean mentally…there are many<br>
things that bother me here but being with my parents right now is important<br>
to me. Physically, the only thing really wrong is the number of colds I<br>
get.</p>
<p>Pamela: 9.Are you able to go back to your own world line?</p>
<p>Timetravel_0: Yes.</p>
<p>Pamela: 10.how are you protecting yourself from radiation? it alters DNA if you<br>
dont.</p>
<p>Timetravel_0: I’m not sure what radiation you mean. If you mean from the unit, you can<br>
see it vents X-rays and Gamma radiation out of the rear. As long as you<br>
stay away from that, you should be okay. I keep a radiation detector with<br>
me to check my environment and make sure the unit isn’t “leaking”.</p>
<p>Pamela: 11.How long would you say that ultraviolet radiation lasts? about 10<br>
seconds?<br>
and when you are in that light can you see anything around you or does the<br>
light kind of “fill up” everything and that is all you can see at the<br>
time?</p>
<p>Timetravel_0: The light bending only lasts a second. Its like driving under a tunnel and<br>
being in total black.</p>
<p>Pamela: 12.Do your people know where you are right now? Can you communicate with<br>
them?<br>
do you have a biological implant?</p>
<p>Timetravel_0: No. They do not know where I am and I can not communicate with them.<br>
Interesting idea though. From their point of view, I will return almost<br>
exactly at the same moment I left. From their viewpoint, I will only have<br>
aged more than expected.</p>
<p>Pamela: 13. after the flash of light is gone are you then in another time? what<br>
does it look like as the new time unfolds? Is it just there? or does it<br>
slowly come into view? does it fade in and out for a time?</p>
<p>Timetravel_0: While the machine is on. Everything is black. When the machine is turned<br>
off, it is the reverse affect. It appears you are driving out from a<br>
bridge. To tell you the truth, I’m usually sleeping when the unit turns off<br>
but yes…it does appear that the world fades in from black.</p>
<p>Pamela: 14. what happens if the device messes up?<br>
Do you end up in space? if it goes offline and shifts ? does a hole open<br>
elsewhere?</p>
<p>Timetravel_0: Good question!!! That one almost never comes up. The hard part of<br>
traveling through time is not the bending of gravity but the plotting of<br>
your course and holding to the basic “position” in your environment. This<br>
is done through a system called VGL (variable gravity lock). Basically, the<br>
unit takes a reading of the local gravity and samples it during the “trip”<br>
in pulses. If the gravity is too far off, the unit stops or reverses itself<br>
to the last sample period where the readings were correct. If there is some<br>
sort of failure, the unit shuts down and drops out to where ever you may be.</p>
<p>Pamela: 15. what affects are caused on the immediate area where the gravity has<br>
been distorted after you leave it and when you arrive? are there permanent<br>
effects left on the land such as electromagnetic disturbances in that<br>
area?</p>
<p>Timetravel_0: Another good question!!! The only real physical trace is a large chunk of<br>
ground missing from the point of origin and a large pile of dirt at the<br>
destination. The gravity field surrounds a small portion of the earth under<br>
you and takes it along for the ride. There is really no way around this.</p>
<p>Please feel free to post these if you wish.</p>
