:\\\"administrative\\\",\\\"showType\\\":\\\"false\\\",\\\"id\\\":\\\"North Carolina, United States\\\"}\"},\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/2\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":109089,\"name\":\"Darby\",\"username\":\"Darby\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/darby/{size}/9_2.png\",\"created_at\":\"2022-05-29T17:22:51.000Z\",\"cooked\":\"\\u003cp\\u003eYou probably found the correct Yareisa.  She is/was an artist/web designer.  When I did my Google search I recall that there was only a couple of references to “Yareisa” and that’s how I found her.  Today there are dozens of Google hits but they all point to the IRC log.\\u003c/p\\u003e\\n\\u003cp\\u003eShe was really reluctant to say much at all, even when she posted the few times that she did.  She really got spooked by Boomer, the author.  It wasn’t the time travel story or the World War III story he told.  It was the person doing the writing - she didn’t like Boomer.  For the most part all she really did was verify that the IRC log was real, the conversation took place as stated on the log, the log was accurate and she didn’t believe the story.\\u003c/p\\u003e\\n\\u003cp\\u003eShe was only on Anomalies for a few weeks and then stopped posting.  Because we received the IRC log anonymously we never were able to find what site it came from thus we were unable to contact G or Wyrm, the other two people in the chatroom.  I did some Google searches cr. 2010-2011 but there just wasn’t enough information on the log to find the site (Google searching “G” was not very useful    \\u003cimg src=\\\"https://timetravelinstitute.com/images/emoji/twemoji/smiling_face_with_sunglasses.png?v=14\\\" title=\\\":smiling_face_with_sunglasses:\\\" class=\\\"emoji\\\" alt=\\\":smiling_face_with_sunglasses:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e   ).  I’ve never come across any posts or comments indicating that G or Wyrm became aware that they were part of the Titor Saga and posted anything about it.\\u003c/p\\u003e\\n\\u003cp\\u003eWhat was interesting is that she profiled much like Pamela - young woman, kind of a hippie, a bit of a snowflake, usually open to just about anything “abnormal”.  Unlike Pamela she quickly got a bad vibe from Boomer and took action…she stopped communicating with him. She never said what it was, exactly, that creaped her out about Boomer but it was significant enough for her to refrain from communicating with me for years after I first attempted contact.\\u003c/p\\u003e\",\"post_number\":3,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-07-18T02:08:53.901Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":15,\"readers_count\":14,\"score\":13.0,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Darby\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":2}],\"moderator\":true,\"admin\":false,\"staff\":true,\"user_id\":135,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/3\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":2,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":109959,\"name\":\"Darby\",\"username\":\"Darby\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/darby/{size}/9_2.png\",\"created_at\":\"2022-11-26T07:50:31.000Z\",\"cooked\":\"\\u003cp\\u003eOK Folks,\\u003c/p\\u003e\\n\\u003cp\\u003eI went back to my HDD drive collection looking for 2005 archives of certain threads from \\u003ca href=\\\"http://Anomalies.net\\\"\\u003eAnomalies.net\\u003c/a\\u003e. I found a thread Yareisa posted on. I have further information on Yareisa that I had actually long ago forgotten about. Yes, she is/was a web designer living in England. Her handle on Anomalies was MysticWarrior. Recall that in the IRC Log she said she was a Warrior. I’ve copied the “Is It Time to Close the ‘Titor Files’” thread below. Keep in mind that in this thread I clarify that I wasn’t proposing deleting or locking the threads. The object was to say Yes or No that it was a hoax and if a hoax to close the “Titor File” as an ongoing investigation by the Anomalies staff:\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-109959-topic-is-it-time-to-close-the-titor-files-1\\\" class=\\\"anchor\\\" href=\\\"#p-109959-topic-is-it-time-to-close-the-titor-files-1\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eTopic: Is It Time To Close The “Titor Files”?\\u003c/h2\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eDarby\\u003c/strong\\u003e — Administrator · Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#41\\u003c/span\\u003e \\u003csmall\\u003eposted November 26, 2005 21:59\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eI asked a similar question a few years ago (even though I believed at the time that it was too soon to make the call).\\u003c/p\\u003e\\n\\u003cp\\u003eBut we are now at the end of 2005.\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eThere have been no Weekly Wacky Waco Incidents,\\u003c/li\\u003e\\n\\u003cli\\u003eThere was nothing close to unusual civil unrest during the 2004 elections.\\u003c/li\\u003e\\n\\u003cli\\u003eTitor said that he time traveled to 1975 to obtain an IBM 5100 computer.\\u003c/li\\u003e\\n\\u003cli\\u003eIn some posts he said “5110” but when questioned about the discrepancy he said it was a typo - he meant IBM 5100, not 5110.\\u003c/li\\u003e\\n\\u003cli\\u003ePamela asked him to sent her something that had time traveled. He sent he the manufacturer’s label from the PC that he obtained in 1975. It was a label from an IBM 5110 (it said IBM 5110 on it). The 5110 was not invented until 1978.\\u003c/li\\u003e\\n\\u003cli\\u003eWestern Civilization doesn’t seem to be on the verge of collapsing due to instability during the next five weeks (what is left of 2005) as Titor predicted.\\u003c/li\\u003e\\n\\u003cli\\u003eTitor predicted that the 2004 Olympics were the last known Games. The 2006 Olympics are on track to be held in Italy this winter.\\u003c/li\\u003e\\n\\u003cli\\u003evCJD (Mad Cow Disease) hasn’t become a pandemic disease as Titor predicted.\\u003c/li\\u003e\\n\\u003cli\\u003eAn attorney who runs a movie production company is the general manager and probably the founder of the John Titor Foundation who claims to represent the family of John Titor.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eSo I ask the question again: Isn’t it time to label this case “Debunked” and to move on?\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eE. W. “Darby” Darbyshire — Administrator, \\u003ca href=\\\"http://Anomalies.net\\\"\\u003eAnomalies.net\\u003c/a\\u003e\\u003c/em\\u003e \\u003cem\\u003e“My goal is not to believed and I submit that your life would not be any better (and perhaps worse) if you did believe me.” ~John Titor\\u003c/em\\u003e Posts: 4004 · From: CA · Registered: May 2001\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003evamelungeon\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#3326\\u003c/span\\u003e \\u003csmall\\u003eposted November 27, 2005 01:20\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eYes. I think it can be declared to be “over” except for those people continue to twist, spin and fabricate. For those types it will never be over.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003ePosts: 445 · From: Virginia · Registered: Aug 2003\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eEinstein\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#3004\\u003c/span\\u003e \\u003csmall\\u003eposted November 27, 2005 10:26\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eYes, I wholeheartedly agree! Titor Files Closed! In fact I’m surprised you didn’t make this a poll.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003ePosts: 830 · From: California · Registered: Feb 2003\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eINVICTUS\\u003c/strong\\u003e — Valued Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#4900\\u003c/span\\u003e \\u003csmall\\u003eposted November 27, 2005 12:03\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eCase closed.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003enon sibi, sed patriae — \\u003ca href=\\\"http://www.homelandsecurityus.com\\\"\\u003ehttp://www.homelandsecurityus.com\\u003c/a\\u003e\\u003c/em\\u003e Posts: 3108 · From: USA · Registered: Mar 2004\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eExpandedMInd\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#2197\\u003c/span\\u003e \\u003csmall\\u003eposted November 27, 2005 14:50\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eYep, Titor is history.\\u003c/p\\u003e\\n\\u003cp\\u003eHehehehhahahahHAHAHAhahahaha…giggle,snort..urk…urk…THUD.\\u003c/p\\u003e\\n\\u003cp\\u003eEM\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eQuestion for my Socialist friends: Why are others bound to do for you what you won’t do for yourselves?\\u003c/em\\u003e Posts: 1623 · From: Denver, Colorado · Registered: Mar 2002\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eTreversal\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#2800\\u003c/span\\u003e \\u003csmall\\u003eposted November 27, 2005 18:01\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWho is Titor?\\u003c/p\\u003e\\n\\u003cp\\u003e-T\\u003c/p\\u003e\\n\\u003cp\\u003e…no really, I would like to know who he is.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eTreversal — Time: A nonspatial continuum in which events occur in apparently irreversible succession from the past through the present to the future. -Dictionary.com\\u003c/em\\u003e Posts: 1524 · From: New Jersey · Registered: Oct 2002\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eDarby\\u003c/strong\\u003e — Administrator · Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#41\\u003c/span\\u003e \\u003csmall\\u003eposted November 27, 2005 21:03\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eOK…\\u003c/p\\u003e\\n\\u003cp\\u003eI’ll let this run for a while. Considering the “fast” pace that my humble(d) TT forum has been running at lately I don’t think that there’s much chance that this thread will get lost by dropping off of the front page in the near future.\\u003c/p\\u003e\\n\\u003cp\\u003eEinstein,\\u003c/p\\u003e\\n\\u003cp\\u003eI hear you re. the poll. Back in 2003 and again in 2004 I ran “Is Titor Real” polls. On another site last week they ran the same poll.\\u003c/p\\u003e\\n\\u003cp\\u003eAll three polls, 2003, 2004 and 2005 had virtually identical results:\\u003c/p\\u003e\\n\\u003cp\\u003e75% Titor is a Hoax 10% Titor is Real 15% Undecided\\u003c/p\\u003e\\n\\u003cp\\u003eOver time the “Undecided” have moved toward “Hoax”. The “Reals” have stayed fairly consistent but have recently dropped to 10%.\\u003c/p\\u003e\\n\\u003cp\\u003eOn some other sites you can see what the “Reals” believe. They are now talking abouot Steven Gibbs, the HDR and how they are able to verify Titor by astral time travel. Oh, boy…\\u003c/p\\u003e\\n\\u003cp\\u003eExpandedMind has it correct *!%@ Thud!\\u003c/p\\u003e\\n\\u003cp\\u003eOn a serious note, once we decide to make the call I’ll have to “write it up”. We obviously can’t, after almost six years, say “Its over. We say its a hoax so it’s a hoax. So there.”\\u003c/p\\u003e\\n\\u003cp\\u003eI’m going to announce on some of the other sites that we have this plan in mind. And, yes, I’ll also invite the Titorites to make their plea or statement.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eE. W. “Darby” Darbyshire — Administrator, \\u003ca href=\\\"http://Anomalies.net\\\"\\u003eAnomalies.net\\u003c/a\\u003e\\u003c/em\\u003e \\u003cem\\u003e“My goal is not to believed and I submit that your life would not be any better (and perhaps worse) if you did believe me.” ~John Titor\\u003c/em\\u003e Posts: 4004 · From: CA · Registered: May 2001\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eMysticWarrior\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#5017\\u003c/span\\u003e \\u003csmall\\u003eposted November 28, 2005 02:33\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThere’s no need to close the files, they don’t exist, or wont exist once I’ve nipped back in time to my chat with the darned time traveller and told him he’s a hoax\\u003c/p\\u003e\\n\\u003cp\\u003eSo take a last look…still here?\\u003c/p\\u003e\\n\\u003cp\\u003eBother, mission failed!\\u003c/p\\u003e\\n\\u003cp\\u003eShana\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003e\\u003ca href=\\\"http://yareisa.com\\\"\\u003eyareisa.com\\u003c/a\\u003e\\u003c/em\\u003e Posts: 237 · From: england · Registered: Apr 2004\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eDarby\\u003c/strong\\u003e — Administrator · Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#41\\u003c/span\\u003e \\u003csmall\\u003eposted November 28, 2005 23:50\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eShana,\\u003c/p\\u003e\\n\\u003cp\\u003eTee-hee-hee…don’t make me soil my armor, woman.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eE. W. “Darby” Darbyshire — Administrator, \\u003ca href=\\\"http://Anomalies.net\\\"\\u003eAnomalies.net\\u003c/a\\u003e\\u003c/em\\u003e \\u003cem\\u003e“My goal is not to believed and I submit that your life would not be any better (and perhaps worse) if you did believe me.” ~John Titor\\u003c/em\\u003e Posts: 4004 · From: CA · Registered: May 2001\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eDarby\\u003c/strong\\u003e — Administrator · Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#41\\u003c/span\\u003e \\u003csmall\\u003eposted November 28, 2005 23:55\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eShana,\\u003c/p\\u003e\\n\\u003cp\\u003eOn a serious note, thank you for coming here. As far as we can tell it was you, and not the members of TTI, whom Titor first contacted with his story.\\u003c/p\\u003e\\n\\u003cp\\u003eNo matter what anyone thinks of Titor’s story (real or hoax)it has taken on a life worldwide that has been shared by thousands of people…and you are an integral part of the story.\\u003c/p\\u003e\\n\\u003cp\\u003eIt would have been nice to have had “G degrees” come on with you.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eE. W. “Darby” Darbyshire — Administrator, \\u003ca href=\\\"http://Anomalies.net\\\"\\u003eAnomalies.net\\u003c/a\\u003e\\u003c/em\\u003e \\u003cem\\u003e“My goal is not to believed and I submit that your life would not be any better (and perhaps worse) if you did believe me.” ~John Titor\\u003c/em\\u003e Posts: 4004 · From: CA · Registered: May 2001\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eAce1\\u003c/strong\\u003e — Moderator · Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#6292\\u003c/span\\u003e \\u003csmall\\u003eposted November 29, 2005 05:21\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI’m going to announce on some of the other sites that we have this plan in mind. And, yes, I’ll also invite the Titorites to make their plea or statement.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eBring 'em on!\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003e“Where there is much desire to learn, there of necessity will be much arguing, much writing, many opinions; for opinion in good men is but knowledge in the making.” — John Milton\\u003c/em\\u003e \\u003cem\\u003eThe stakes are high here. Have you considered folding?\\u003c/em\\u003e Posts: 348 · From: Montana · Registered: Aug 2005\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eMysticWarrior\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#5017\\u003c/span\\u003e \\u003csmall\\u003eposted November 29, 2005 05:38\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eOriginally posted by Darby:\\u003c/strong\\u003e Shana,\\u003c/p\\u003e\\n\\u003cp\\u003eOn a serious note, thank you for coming here. As far as we can tell it was you, and not the members of TTI, whom Titor first contacted with his story.\\u003c/p\\u003e\\n\\u003cp\\u003eNo matter what anyone thinks of Titor’s story (real or hoax)it has taken on a life worldwide that has been shared by thousands of people…and you are an integral part of the story.\\u003c/p\\u003e\\n\\u003cp\\u003eIt would have been nice to have had “G degrees” come on with you.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eSuprised you managed to post with your rusty armour\\u003c/p\\u003e\\n\\u003cp\\u003e“G degrees” was a good friend, he lives in Leeds, we met in the real world after chatting online. A lovely lad, good and honest. For some strange reason after my b/friend moved in, he never spoke to me again, men are sooooo weird!\\u003c/p\\u003e\\n\\u003cp\\u003eAs you may know, my approach to the Titor business is from the spiritual side of things. After all, that was roughly the subject matter of the chat room I had, psychic, aliens, the usual conspiracy stuff.\\u003c/p\\u003e\\n\\u003cp\\u003eI’ve probably mentioned before that his was not the only strange meeting I had in chat around that time. So it didn’t seem out of place, at the time.\\u003c/p\\u003e\\n\\u003cp\\u003eI’m now trying to move away from that kind of stuff, but as fast as I move in one direction, it finds me from another. Personally, I’ve always felt there was some reason why I had that chat with Titor, and more specifically, why I kept a copy of the chat. Something I’ve never done before, or since. It was a milestone, a marker for future reference, that’s all I know.\\u003c/p\\u003e\\n\\u003cp\\u003eSo I think to come to a decision about whether it’s real or a hoax, all I can say is that the chat really happened, it’s what people did with it after that’s the hoax.\\u003c/p\\u003e\\n\\u003cp\\u003eShana\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003e\\u003ca href=\\\"http://yareisa.com\\\"\\u003eyareisa.com\\u003c/a\\u003e\\u003c/em\\u003e Posts: 237 · From: england · Registered: Apr 2004\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eAuralCommune\\u003c/strong\\u003e — Newbie · Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#3543\\u003c/span\\u003e \\u003csmall\\u003eposted December 06, 2005 17:37\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWhere’s Pamela? Once this is considered “debunked” by you darby, will you fess up your private info. And will she, and the others?\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eeveryone has problems with the truth, and problems with lies. It’s problems that we need to work on.\\u003c/em\\u003e Posts: 11 · From: earth · Registered: Sep 2003\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eShoe_String_Theory\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#4173\\u003c/span\\u003e \\u003csmall\\u003eposted December 07, 2005 04:07\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eI think it was closed a long time ago. I’ll not shed a tear at it’s official demise.\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eSST\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003ePosts: 197 · From: London, UK · Registered: Jan 2004\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eLev-Aten\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#5133\\u003c/span\\u003e \\u003csmall\\u003eposted December 07, 2005 13:56\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e::.. OH! Please close em’ :: Close em’ all!!! ..::\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003ePosts: 278 · From: USA · Registered: May 2004\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003esandman658\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#5305\\u003c/span\\u003e \\u003csmall\\u003eposted December 09, 2005 11:17\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eHopefully the brains behind it will post on here. Give some details on how and why they came up with this adventure. That will be a good read.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003ePosts: 59 · From: NJ · Registered: Jul 2004\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eBastastic\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#5965\\u003c/span\\u003e \\u003csmall\\u003eposted January 02, 2006 04:15\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eLock up the files and toss away the key.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eWhere am I going and why am I in this handbasket?\\u003c/em\\u003e Posts: 172 · From: Phoenix, AZ · Registered: Feb 2005\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003evamelungeon\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#3326\\u003c/span\\u003e \\u003csmall\\u003eposted January 02, 2006 21:42\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eI believer the Winter Olympics start Feb. 10 in Italy. There is no reason to believe at this time that they won’t be held.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003ePosts: 445 · From: Virginia · Registered: Aug 2003\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eDarby\\u003c/strong\\u003e — Administrator · Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#41\\u003c/span\\u003e \\u003csmall\\u003eposted January 03, 2006 18:37\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAuralCommune,\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eWhere’s Pamela? Once this is considered “debunked” by you darby, will you fess up your private info. And will she, and the others?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eI don’t know where Pamela “is”. She no longer posts here and, frankly, she rarely posts anywhere anymore. Even Pamela eventually got burned out on the Titor Saga.\\u003c/p\\u003e\\n\\u003cp\\u003eAs to posting private information, for my part, the answer is no. It isn’t a matter of the story being closed out as an Internet hoax. Its a matter of privacy agreements (under TOS rules). Titor was covered under those rules and I cannot break them. He does have an attorney, you know. And the attorney is the business manager for John Titor Foundation enterprises. Hear what I’m saying?\\u003c/p\\u003e\\n\\u003cp\\u003eWill Pamela divulge her private information? According to what she’s said in the past, no. But that’s up to Pamela - not me.\\u003c/p\\u003e\\n\\u003cp\\u003eWill Rick Donaldson divulge his information? According to Rick, yes. At some point in time he plans to divulge his inforamtion. He didn’t come about his information via the same route that I received mine. His information, apparently (he hasn’t divulged the contents to me), is not covered by TOS \\u0026amp; Privacy agreements.\\u003c/p\\u003e\\n\\u003cp\\u003eThe real question is, do you really need to know who was behind Titor? If you learned, for instance, that it was a teenage boy and his father \\u0026amp; friends would your life be any better or even different?\\u003c/p\\u003e\\n\\u003cp\\u003eThe Titor Saga is no different than any other Internet time travel story with this exception: The Anomalies staff set out to keep the story alive once Art Bell’s BBS closed. Titor was gone in as much as posting under his “I am from 2036” handles (which doesn’t mean that he stopped posting - he didn’t). He made no further contributions to the story after March of 2000. Your staff here (and Pamela while she was on staff at Anomalies) kept the story alive when it was D.O.A. By the end of 2000 the Titor Saga was a dead issue. It was only being discussed here and even here it was not a really hot topic. The Time Travel Institute BBS was a mess…an absolute travesty. They weren’t discussing anything there.\\u003c/p\\u003e\\n\\u003cp\\u003eSo we kept the story alive. Why? Why not. It kept up interest in the TT board if nothing else. Ultimately it appears that our efforts to keep the story alive inspired both Oliver Williams (\\u003ca href=\\\"http://JohnTitor.com\\\"\\u003eJohnTitor.com\\u003c/a\\u003e) and Larry Haber (John Titor Foundation) to take a crack at Titor fame. And it inspired a host of sites to take up the Titor story on their BBS systems. It became a worldwide hit to some degree. Titor didn’t cause that, Oliver Williams didn’t cause that and Larry Haber didn’t cause that to happen. \\u003ca href=\\\"http://Anomalies.net\\\"\\u003eAnomalies.net\\u003c/a\\u003e, its staff and “old hand” regular members who came with us from Post-2-Post made that happen.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eE. W. “Darby” Darbyshire — Administrator, \\u003ca href=\\\"http://Anomalies.net\\\"\\u003eAnomalies.net\\u003c/a\\u003e\\u003c/em\\u003e \\u003cem\\u003e“My goal is not to believed and I submit that your life would not be any better (and perhaps worse) if you did believe me.” ~John Titor\\u003c/em\\u003e Posts: 4004 · From: CA · Registered: May 2001\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eDarby\\u003c/strong\\u003e — Administrator · Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#41\\u003c/span\\u003e \\u003csmall\\u003eposted January 03, 2006 18:42\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eBTW:\\u003c/p\\u003e\\n\\u003cp\\u003eRelative to my comments above about Time Trravel Institute:\\u003c/p\\u003e\\n\\u003cp\\u003eI didn’t just let TTI go under because it was a mess. The owner of TTI, Raul Burriel, is my professional friend and associate. I contacted him and annouced my observations about how his site was fairing. I then suggested a couple of names for moderators (he had none). He took my input in stride and asked one of the original Titor “old hands” to be his moderator (Roel van Houten from the Netherlands). He happened to be one of the people that I recommended.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eE. W. “Darby” Darbyshire — Administrator, \\u003ca href=\\\"http://Anomalies.net\\\"\\u003eAnomalies.net\\u003c/a\\u003e\\u003c/em\\u003e \\u003cem\\u003e“My goal is not to believed and I submit that your life would not be any better (and perhaps worse) if you did believe me.” ~John Titor\\u003c/em\\u003e Posts: 4004 · From: CA · Registered: May 2001\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eAlpha Omega\\u003c/strong\\u003e — Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#1716\\u003c/span\\u003e \\u003csmall\\u003eposted January 09, 2006 16:39\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThought this was over long ago\\u003c/p\\u003e\\n\\u003cp\\u003eRegards, Steve\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003e…and that’s the bottom line!\\u003c/em\\u003e Posts: 308 · From: UK · Registered: Nov 2001\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eDarby\\u003c/strong\\u003e — Administrator · Member \\u003cspan class=\\\"hashtag-raw\\\"\\u003e#41\\u003c/span\\u003e \\u003csmall\\u003eposted January 09, 2006 22:12\\u003c/small\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eSteve,\\u003c/p\\u003e\\n\\u003cp\\u003eIts not quite over - we haven’t reached the Omega Point.\\u003c/p\\u003e\\n\\u003cp\\u003eBut its close. I did receive, BTW, an inquiry from an indy film company in Japan who might be working a deal with Sony to produce a film about Titor.\\u003c/p\\u003e\\n\\u003cp\\u003eWhy? I don’t know. In my reply I let them know that another film exec/attorney (Haber) already represents that his “client” has certain copyrights, that he is the business manager for JTF and that they might want to contact Mr. haber. I’m waiting for a reply.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003csmall\\u003e\\u003cem\\u003eE. W. “Darby” Darbyshire — Administrator, \\u003ca href=\\\"http://Anomalies.net\\\"\\u003eAnomalies.net\\u003c/a\\u003e\\u003c/em\\u003e \\u003cem\\u003e“My goal is not to believed and I submit that your life would not be any better (and perhaps worse) if you did believe me.” ~John Titor\\u003c/em\\u003e Posts: 4004 · From: CA · Registered: May 2001\\u003c/small\\u003e\\u003c/p\\u003e\",\"post_number\":4,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2026-08-02T22:01:59.033Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":4,\"reads\":14,\"readers_count\":13,\"score\":22.8,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Darby\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":2,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"http://Anomalies.net\",\"internal\":false,\"reflection\":false,\"clicks\":3},{\"url\":\"http://JohnTitor.com\",\"internal\":false,\"reflection\":false,\"title\":\"John Titor - Time Traveler\",\"clicks\":0},{\"url\":\"http://yareisa.com\",\"internal\":false,\"reflection\":false,\"clicks\":0},{\"url\":\"http://www.homelandsecurityus.com\",\"internal\":false,\"reflection\":false,\"clicks\":0}],\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":true,\"admin\":false,\"staff\":true,\"user_id\":135,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/4\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":109973,\"name\":\"GodofPlague\",\"username\":\"GodofPlague\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/g/D4A830/{size}.png\",\"created_at\":\"2022-12-04T02:07:17.000Z\",\"cooked\":\"\\u003cp\\u003eThe cool thing is I heard about Titor on the mainstream news i was around 20. Then I was reminded about him from the anime Steins Gate. Although it had a bit of a twist. Now 23 years later I find what started it all.\\u003c/p\\u003e\",\"post_number\":5,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-07-18T02:10:43.335Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":9,\"readers_count\":8,\"score\":6.8,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"GodofPlague\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":2718,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/5\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":110922,\"name\":\"Darby\",\"username\":\"Darby\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/darby/{size}/9_2.png\",\"created_at\":\"2023-12-06T23:02:52.000Z\",\"cooked\":\"\\u003caside class=\\\"quote no-group\\\" data-username=\\\"GodofPlague\\\" data-post=\\\"5\\\" data-topic=\\\"16126\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://timetravelinstitute.com/letter_avatar_proxy/v4/letter/g/b5ac83/48.png\\\" class=\\\"avatar\\\"\\u003e GodofPlague:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eThe cool thing is I heard about Titor on the mainstream news i was around 20. Then I was reminded about him from the anime Steins Gate. Although it had a bit of a twist. Now 23 years later I find what started it all.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eUnfortunately I didn’t see your message a year ago.  I’ll respond anyway just in case you lurk the forum:\\u003c/p\\u003e\\n\\u003cp\\u003eNo, the IRC log from Yareisa is not the beginning of The Titor Saga.  The story began on July 29, 1998 when Titor sent a fax to Art Bell concerning CERN and Y2K.  He then did a follow-up fax in 2000.  The long delay was because Art Bell “retired” for the first time shortly after the 1998 fax and didn’t return for almost 2 years.  I’ll insert the faxes below though there is a thread somewhere in this part of the forum that already has the faxes.\\u003c/p\\u003e\\n\\u003cp\\u003eIn the initial fax (1998) Titor said Y2K would [in the USA] be a huge disaster, many people would freeze to death because of the power failures and the government would impose matial law. “A few years later a communal government system is developed after the constitution takes a few twists. China retakes Taiwan, Israel wins the largest battle for their life and Russia is covered in Nuclear snow from their collapsed reactors.”  In his later posts he clarified that “a few years later” meant 2004.  Of course none of that occurred.\\u003c/p\\u003e\\n\\u003cp\\u003eHere are the faxes:\\u003c/p\\u003e\\n\\u003cp\\u003eArt Bell, during his radio show Coast-to-Coast AM, read these two faxes on air during his show:\\u003c/p\\u003e\\n\\u003cp\\u003eFAX ONE: 29-JUL-1998\\u003c/p\\u003e\\n\\u003cp\\u003eDear Art,\\u003c/p\\u003e\\n\\u003cp\\u003eI had to fax when I heard other time travelers calling in from any time past the year 2500 AD.\\u003c/p\\u003e\\n\\u003cp\\u003eplease let me explain…\\u003c/p\\u003e\\n\\u003cp\\u003eTime travel was invented in 2034 off shoots of certain successful fusion reactor research allowed scientists at CERN to produce the worlds first contained singularity engine. The basic design involves rotating singularities inside a magnetic field. By altering the speed and direction of rotation you can travel both forward and backward in time.\\u003c/p\\u003e\\n\\u003cp\\u003etime itself can be understood in terms of connected lines. When you go back in time you travel on your original time line when you turn the singularity engine off a new time line is created due to the fact that you and your time machine are now there.\\u003c/p\\u003e\\n\\u003cp\\u003eIn other words a new universe is created. To get back to your original line you must travel a split second farther back and immediately throw the engine into forward without turning it off.\\u003c/p\\u003e\\n\\u003cp\\u003esome interesting outcomes of this are: you meet yourself I have done it often even taken a younger version of myself along for a few rides before returning myself to the new timeline and going back to mine.\\u003c/p\\u003e\\n\\u003cp\\u003eYou can alter history in the new universe that you have just created. Most of the time the changes are subtle. the oldest one was a sky scraper that don’t exist in New York .\\u003cbr\\u003e\\nInterestingly when you travel in time you must compensate for the orbit of the Earth since the time machine doesn’t move you have to adjust the engine so you remain on the planet when you turn it off.\\u003c/p\\u003e\\n\\u003cp\\u003eNow for the future you might want to know about..Y2K is a disaster . Many people die on the highways when they freeze to death trying to get to warmer weather. The gov. tries to keep power by instituting marshal law but all of it collapses when their efforts to bring the power back up fail.\\u003c/p\\u003e\\n\\u003cp\\u003eA few years later a communal government system is developed after the constitution takes a few twists. China retakes Taiwan, Israel wins the largest battle for their life and Russia is covered in Nuclear snow from their collapsed reactors.\\u003c/p\\u003e\\n\\u003cp\\u003eFAX TWO: Apr-2000\\u003c/p\\u003e\\n\\u003cp\\u003eDear Mr. Bell I am glad you 're back. I faxed this information to you the day before you left the air. I wanted to make sure it wasn’t lost in the shuffle so I am sending a gift.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you’ve already seen this please accept my apologies if you choose to make this public please do not publish the fax number. I had to fax when I heard the other time traveler calling in from the recent time past in fact the year 2500 Ad.\\u003c/p\\u003e\\n\\u003cp\\u003eLet me explain…\\u003c/p\\u003e\\n\\u003cp\\u003eMr. Bell I sent a fax with this opening on July 29 1998. As I said then I am a time traveler. I have been on this world line since April of this year and I plan to leave soon. Typically time travelers do not purposely affect the world lines they visit. However this mission is unusually long and I’ve grown attached to some of the people I have met here. (isn’t that the Stockholm syndrome or something? - Art says)\\u003cbr\\u003e\\nAnyway for my own reasons I have decided to help this world line by sharing information about the future with a few people in the hope that it will help their future. I am contacting you for the same reason. Unfortunately there is no historical reference to your program in my world line.\\u003c/p\\u003e\\n\\u003cp\\u003eI believe you can change your future by creating one now. Some of the information presented on your program maybe invaluable to upline researchers. I suggest you isolate the programs that concentrate on military technology and new physics theories. Transcribe these programs and put them someplace safe away from the box. I recommend someplace in the mid west. (away from the box what does he mean?-art says) I also urge you to reconsider your paranoia to the Russians (I am not paranoid about the Russians) They are not preparing for war with the average US citizen. They are preparing for war with the US government. They will eventually save this country and the lives of million of Americans. I realize my claims are a bit difficult to accept so I will send the following once I know you have received this fax. A few pages from the operations manual of my time machine. And a few colored photographs of my vehicle.( alright so you know I got it send them along.-art says)\\u003c/p\\u003e\\n\\u003cp\\u003eIf you wish to contact me I will be happy to share with you the nature of time , the physics of time travel and some of the events of your future.(God I hadn’t read this earlier..) Please send a return package to…\\u003c/p\\u003e\\n\\u003cp\\u003e[At this point Art Bell explains that he would not read the address on air]\\u003c/p\\u003e\",\"post_number\":6,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-07-18T02:12:38.266Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":1,\"incoming_link_count\":0,\"reads\":10,\"readers_count\":9,\"score\":7.0,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Darby\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":true,\"admin\":false,\"staff\":true,\"user_id\":135,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"c t send them along.-art says)\\u003c/p\\u003e\\n\\u003cp\\u003eIf you wish to contact me I will be happy to share with you the nature of time , the physics of time travel and some of the events of your future.(God I hadn’t read this earlier..) Please send a return package to…\\u003c/p\\u003e\\n\\u003cp\\u003e[At this point Art Bell explains that he would not read the address on air]\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cdiv class=\\\"youtube-onebox lazy-video-container\\\" data-video-id=\\\"fgzTtz3ukfI\\\" data-video-title=\\\"Art Bell Interviews Time Traveler from the Year 2063 named \\u0026quot;Single Seven a.k.a. Jonathan\\u0026quot;\\\" data-video-start-time=\\\"\\\" data-provider-name=\\\"youtube\\\"\\u003e\\n  \\u003ca href=\\\"https://www.youtube.com/watch?v=fgzTtz3ukfI\\\" target=\\\"_blank\\\" class=\\\"video-thumbnail\\\" rel=\\\"noopener nofollow ugc\\\"\\u003e\\n    \\u003cimg class=\\\"youtube-thumbnail\\\" src=\\\"https://timetravelinstitute.com/uploads/default/original/1X/9bb236bc5149e50207581daa9e48aef885451891.jpeg\\\" title=\\\"Art Bell Interviews Time Traveler from the Year 2063 named \\u0026quot;Single Seven a.k.a. Jonathan\\u0026quot;\\\" data-dominant-color=\\\"1E1818\\\" width=\\\"690\\\" height=\\\"388\\\"\\u003e\\n  \\u003c/a\\u003e\\n\\u003c/div\\u003e\\n\\n\\u003cp\\u003ePlease help me out here with the original contact date timing for Coadt2CoastAM.  Single 7 calls Art Bell in July of 1998.  Art Bell announces on air that he received a fax from John Titor in October 1998.  Was that fax sent in late July immediately after Single 7 called Art Bell?  If so, why did Art wait 3 months to mention the fax on air?\\u003c/p\\u003e\\n\\u003cdiv class=\\\"youtube-onebox lazy-video-container\\\" data-video-id=\\\"Sa0Jg_GekFA\\\" data-video-title=\\\"John Titor 1st Fax sent to Art Bell (July 29th, 1998)\\\" data-video-start-time=\\\"\\\" data-provider-name=\\\"youtube\\\"\\u003e\\n  \\u003ca href=\\\"https://www.youtube.com/watch?v=Sa0Jg_GekFA\\\" target=\\\"_blank\\\" class=\\\"video-thumbnail\\\" rel=\\\"noopener nofollow ugc\\\"\\u003e\\n    \\u003cimg class=\\\"youtube-thumbnail\\\" src=\\\"https://timetravelinstitute.com/uploads/default/original/1X/897d3748192bfbd39a253d3686984bf5142a9dc8.jpeg\\\" title=\\\"John Titor 1st Fax sent to Art Bell (July 29th, 1998)\\\" data-dominant-color=\\\"2E2D1B\\\" width=\\\"690\\\" height=\\\"388\\\"\\u003e\\n  \\u003c/a\\u003e\\n\\u003c/div\\u003e\\n\",\"post_number\":9,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-07-18T02:12:49.468Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":1,\"incoming_link_count\":0,\"reads\":9,\"readers_count\":8,\"score\":1.8,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"JudasTitor\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://www.youtube.com/watch?v=fgzTtz3ukfI\",\"internal\":false,\"reflection\":false,\"clicks\":0},{\"url\":\"https://www.youtube.com/watch?v=Sa0Jg_GekFA\",\"internal\":false,\"reflection\":false,\"clicks\":0}],\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":2778,\"hidden\":false,\"trust_level\":3,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/9\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":111249,\"name\":\"Emit 0'Levart\",\"username\":\"Emit_0_Levart\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/emit_0_levart/{size}/4060_2.png\",\"created_at\":\"2024-07-07T05:08:18.000Z\",\"cooked\":\"\\u003cp\\u003eIs there a particular reason that the most common recounts of Titor’s legents say he was looking for the 5100, but in this set he says 5101? The difference is quite significant between the two models.\\u003c/p\\u003e\",\"post_number\":10,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-07-18T02:13:23.969Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":9,\"readers_count\":8,\"score\":1.8,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Emit 0'Levart\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":6846,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/10\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":111266,\"name\":\"Darby\",\"username\":\"Darby\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/darby/{size}/9_2.png\",\"created_at\":\"2024-07-09T22:37:45.000Z\",\"cooked\":\"\\u003cp\\u003eAmmy - great question and observation.  Yes, the differences between the two models are significant.  The real issue, with respect to the Titor Saga is he appeared to make typos in his posts on the different BBS sites.  Sometimes it was an IBM 5100.  At other times it was an IBM 5110.  In the context of his story it should have been the IBM 5100.  The problem is it wasn’t simply a typo.  It was a total FUBAR.\\u003c/p\\u003e\\n\\u003cp\\u003ePamala asked Titor/TT0 to send her an item that had time traveled with him.  And so he did.  He peeled off the “IBM 5100” label from the back of the PC that he picked up in 1975 and mailed it to her.  She posted a scan of the item on \\u003ca href=\\\"http://Anomalies.net\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eAnomalies.net\\u003c/a\\u003e (now defunct).  She eventually sent it to a laboratory to have it tested for evidence of time travel.  Needless to say they didn’t find such evidence - or even know how to look for such evidence.  She went on and on about the label, apparently never actually looking at it.  Have you ever heard the term “Confirmation Bias”?  She was suffering from it at the time.  She looked at the label and saw what she wanted to see - IBM 5100.  The label was not from an IBM 5100.  It clearly said “IBM 5110”.  And that’s the big deal.  He said he traveled back to 1975 to get the computer…but the IBM 5110 was not released until January 1978.  She never noticed the error.  I noticed.  It would also appear that Titor himself was suffering from confirmation bias as he didn’t seem to notice that the computer was an IBM 5110 and not a 5100.  Otherwise why would he have sent her the wrong label?  FUBAR.\\u003c/p\\u003e\",\"post_number\":11,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-07-18T02:13:26.344Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":10,\"readers_count\":9,\"score\":7.0,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Darby\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"http://Anomalies.net\",\"internal\":false,\"reflection\":false,\"clicks\":0}],\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":true,\"admin\":false,\"staff\":true,\"user_id\":135,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/11\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":111267,\"name\":\"Emit 0'Levart\",\"username\":\"Emit_0_Levart\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/emit_0_levart/{size}/4060_2.png\",\"created_at\":\"2024-07-10T00:51:44.000Z\",\"cooked\":\"\\u003cp\\u003eInteresting, but even so, if he traveled to 1975 to get a computer, the one he sent Pam that label from was not the computer he picked up there.\\u003c/p\\u003e\\n\\u003cp\\u003eThis is odd, because anyone with half a brain can see there’s something to his story, but this doesn’t make sense. Maybe he was simplifying and got confused. I mean, maybe it’s something as simple as he got both models, hoping that one of them was more ideal and that it was better to have the choice between them. Maybe he figured it was no biggie to stop in at 1978 too, to get the 5110. Who knows? He’s no longer around to ask.\\u003c/p\\u003e\\n\\u003cp\\u003eHere’s an alternative possibility: what if he went to 1975 to get a computer, but that give or take 2% of difference caused by visiting caused a fluke with the way that computer shows to us in our timeline? I know, I know, but isn’t it more than a bit weird?\\u003c/p\\u003e\\n\\u003cp\\u003eOk, so I just came up with another yet. He got the 5100. The time glitch he created there caused his model to, in our timeline, show as a 5110. However, another cone of differential comes into play when he hands the sticker to Pam, and so she is at the beginning, and the differential is tiny, so she sees the same as Titor. However, handing the sticker over to others increases the differential. Voila! It was \\u003cem\\u003eboth\\u003c/em\\u003e models. That’s what I bank on.\\u003c/p\\u003e\\n\\u003cp\\u003eI considered this as I just can’t imagine Pamela not looking at the label. I have read the posts, and she seemed to happpy and alive to be a part of it all. She’d have to have looked.\\u003c/p\\u003e\",\"post_number\":12,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-07-18T02:13:26.457Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":1,\"reads\":11,\"readers_count\":10,\"score\":7.2,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Emit 0'Levart\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":6846,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_his ch evidence - or even know how to look for such evidence.  She went on and on about the label, apparently never actually looking at it.  Have you ever heard the term “Confirmation Bias”?  She was suffering from it at the time.  She looked at the label and saw what she wanted to see - IBM 5100.  The label was not from an IBM 5100.  It clearly said “IBM 5110”.  And that’s the big deal.  He said he traveled back to 1975 to get the computer…but the IBM 5110 was not released until January 1978.  She never noticed the error.  I noticed.  It would also appear that Titor himself was suffering from confirmation bias as he didn’t seem to notice that the computer was an IBM 5110 and not a 5100.  Otherwise why would he have sent her the wrong label?  FUBAR.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI remember reading this story years ago and it was a 5100. Now it appears to be this 5110 business. Strange.\\u003c/p\\u003e\",\"post_number\":13,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-07-18T02:14:17.280Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":1,\"incoming_link_count\":0,\"reads\":11,\"readers_count\":10,\"score\":7.2,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Jared Thompson PhD\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":6922,\"hidden\":false,\"trust_level\":1,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/13\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":118522,\"name\":\"Jay Walker\",\"username\":\"Jay_Walker\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/jay_walker/{size}/446_2.png\",\"created_at\":\"2025-08-29T22:53:42.043Z\",\"cooked\":\"\\u003cp\\u003eDid you try G°? He went by G but his username is G degree. For windows, the shortcut is Alt - 0176. (°)\\u003c/p\\u003e\",\"post_number\":14,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-08-29T22:53:42.043Z\",\"reply_count\":1,\"reply_to_post_number\":3,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":9,\"readers_count\":8,\"score\":6.8,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Jay Walker\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"reply_to_user\":{\"id\":135,\"username\":\"Darby\",\"name\":\"Darby\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/darby/{size}/9_2.png\"},\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":6894,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/14\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":118523,\"name\":\"Jay Walker\",\"username\":\"Jay_Walker\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/jay_walker/{size}/446_2.png\",\"created_at\":\"2025-08-29T23:02:06.035Z\",\"cooked\":\"\\u003cp\\u003eThat is exactly correct. However, if you have seen photos of what Pamela said was the exact machine model that Titor left with was a 5100 series, 5110 type machine. The problem with that is that the 5110 wasn’t produced until 1978. That is a problem if you believe John’s story about visiting his grandfather in 1975. The original 5100 \\u003cem\\u003ewas\\u003c/em\\u003e produced in 1975, and that is why he began only referring to it as the 5100.\\u003c/p\\u003e\\n\\u003caside class=\\\"onebox allowlistedgeneric\\\" data-onebox-src=\\\"https://archive.org/details/JohnTitorTimeMachineManual/page/n9/mode/2up\\\"\\u003e\\n  \\u003cheader class=\\\"source\\\"\\u003e\\n\\n      \\u003ca href=\\\"https://archive.org/details/JohnTitorTimeMachineManual/page/n9/mode/2up\\\" target=\\\"_blank\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eInternet Archive\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\"onebox-body\\\"\\u003e\\n    \\u003cdiv class=\\\"aspect-image\\\" style=\\\"--aspect-ratio:180/233;\\\"\\u003e\\u003cimg src=\\\"https://timetravelinstitute.com/uploads/default/original/2X/2/2759050613e07f19b5fba683dc4c324aec2e18b4.jpeg\\\" class=\\\"thumbnail\\\" alt=\\\"\\\" data-dominant-color=\\\"F5F5F5\\\" width=\\\"180\\\" height=\\\"233\\\"\\u003e\\u003c/div\\u003e\\n\\n\\u003ch3\\u003e\\u003ca href=\\\"https://archive.org/details/JohnTitorTimeMachineManual/page/n9/mode/2up\\\" target=\\\"_blank\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eJohn Titor Time Machine Manual : John Titor : Free Download, Borrow, and...\\u003c/a\\u003e\\u003c/h3\\u003e\\n\\n  \\u003cp\\u003ePictures of John Titor's time machine, and manual, which were posted on\\u0026nbsp; bbs.artbell.com.\\u003c/p\\u003e\\n\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\"onebox-metadata\\\"\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\"clear: both\\\"\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\",\"post_number\":15,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-08-29T23:02:06.035Z\",\"reply_count\":0,\"reply_to_post_number\":13,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":9,\"readers_count\":8,\"score\":1.8,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Jay Walker\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"link_counts\":[{\"url\":\"https://archive.org/details/JohnTitorTimeMachineManual/page/n9/mode/2up\",\"internal\":false,\"reflection\":false,\"title\":\"John Titor Time Machine Manual : John Titor : Free Download, Borrow, and Streaming : Internet Archive\",\"clicks\":5}],\"read\":true,\"user_title\":\"\",\"reply_to_user\":{\"id\":6922,\"username\":\"Jared_Thompson_PhD\",\"name\":\"Jared Thompson PhD\",\"avatar_template\":\"/letter_avatar_proxy/v4/letter/j/2AA79B/{size}.png\"},\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":6894,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/15\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":118802,\"name\":\"Darby\",\"username\":\"Darby\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/darby/{size}/9_2.png\",\"created_at\":\"2025-09-06T09:26:21.011Z\",\"cooked\":\"\\u003cp\\u003eYes, I tried some searches.  But “G°” is just too vague for a valid search.  Yariesa didn’t want to disclose the URL or name of the chatroom they used to meet in, which I can respect.  As I’ve said before, she was very reluctant to even come on Anomalies at all.  She said she didn’t get a good “vibe” from Titor/TTO and wanted to protect her privacy.  So G° is a dead end.\\u003c/p\\u003e\\n\\u003cp\\u003eAs to the label he meant 5100 but the label he sent to Pamela said 5110.  There’s a thread somewhere on Paranormalis where Pamela herself stated that it said 5110 and not 5100.  The problem goes deeper.  The label just says “IBM 5110” in about 36 pt font and is printed on a 3/4” by about 3” white piece of cloth tape that has been cut along one narrow end with pinking shears (scissors that make a line of little triangular cuts).  I’ve seen back and side panel views of dozens of IBM 5100 and 5110 PCs and not one of them has that piece of tape on them.  That leads me to believe that Titor simply duped her.  That I find very strange.  Sure, the Titor Saga is pure fiction based on silly science but nothing I ever saw him put in a post or anything Pamela shared with me regarding their off forum communication had any of the markings of him deliberately lying to her.  Yet there’s the tape that had the wrong model number and which there  isn’t any evidence that I’ve seen suggesting it is something IBM put on their computers.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\"lightbox-wrapper\\\"\\u003e\\u003ca class=\\\"lightbox\\\" href=\\\"https://timetravelinstitute.com/uploads/default/original/2X/0/07dd2895d17d083aefeb4c356c50668af2fa8183.jpeg\\\" data-download-href=\\\"https://timetravelinstitute.com/uploads/default/07dd2895d17d083aefeb4c356c50668af2fa8183\\\" title=\\\"592497-medium\\\"\\u003e\\u003cimg src=\\\"https://timetravelinstitute.com/uploads/default/optimized/2X/0/07dd2895d17d083aefeb4c356c50668af2fa8183_2_530x500.jpeg\\\" alt=\\\"592497-medium\\\" data-base62-sha1=\\\"17zaGd5e4WmexoKqqO8kTNP7hjd\\\" width=\\\"530\\\" height=\\\"500\\\" srcset=\\\"https://timetravelinstitute.com/uploads/default/optimized/2X/0/07dd2895d17d083aefeb4c356c50668af2fa8183_2_530x500.jpeg, https://timetravelinstitute.com/uploads/default/optimized/2X/0/07dd2895d17d083aefeb4c356c50668af2fa8183_2_795x750.jpeg 1.5x, https://timetravelinstitute.com/uploads/default/optimized/2X/0/07dd2895d17d083aefeb4c356c50668af2fa8183_2_1060x1000.jpeg 2x\\\" data-dominant-color=\\\"A3A59D\\\"\\u003e\\u003cdiv class=\\\"meta\\\"\\u003e\\u003csvg class=\\\"fa d-icon d-icon-far-image svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#far-image\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\"filename\\\"\\u003e592497-medium\\u003c/span\\u003e\\u003cspan class=\\\"informations\\\"\\u003e1462×1377 119 KB\\u003c/span\\u003e\\u003csvg class=\\\"fa d-icon d-icon-discourse-expand svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#discourse-expand\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThat’s the back panel of an IBM 5110 with the ID label attached.  The white rectangular to the right of the IBM label has the name and phone number of a computer repair shop on it.  There’s no label like the one Pamela posted.\\u003c/p\\u003e\",\"post_number\":16,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-09-06T09:55:20.408Z\",\"reply_count\":1,\"reply_to_post_number\":14,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":9,\"readers_count\":8,\"score\":51.8,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Darby\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":5,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"reply_to_user\":{\"id\":6894,\"username\":\"Jay_Walker\",\"name\":\"Jay Walker\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/jay_walker/{size}/446_2.png\"},\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":true,\"admin\":false,\"staff\":true,\"user_id\":135,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/16\",\"event\":null,\"reactions\":[{\"id\":\"confetti_ball\",\"type\":\"emoji\",\"count\":1}],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":118806,\"name\":\"Jay Walker\",\"username\":\"Jay_Walker\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/jay_walker/{size}/446_2.png\",\"created_at\":\"2025-09-07T00:41:48.656Z\",\"cooked\":\"\\u003cp\\u003eI am starting to understand where the frustration is coming from.\\u003c/p\\u003e\\n\\u003cp\\u003e5100 could mean one of two things or both.\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e5100 series, or 5100 model.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003e5110 was the 5110 type of the 5100 model series.\\u003c/p\\u003e\\n\\u003cp\\u003e5100 was the first to be released (1975). 5110 was the second release of the series (1978).\\u003c/p\\u003e\\n\\u003cp\\u003eThe 5100 had met all the requirements Titor described he needed.\\u003cbr\\u003e\\nThe 5110 did not.\\u003cbr\\u003e\\nIn the Oct.2000 posts were one night where he mentions the 5110 5 times.\\u003cbr\\u003e\\nFrom Nov, 2000 till departure John mentions the 5110 0 times.\\u003c/p\\u003e\\n\\u003cp\\u003eRepeat for clarity and effect. \\u003cstrong\\u003eZERO Times on  TTI forum.\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eNow, to have enough knowledge about the IBM 5100 to know a very niche detailed feature of functionality that only super-geeks would understand or care about and then to not take the right one to an alternate worldline in which would be one of the few scenarios in which that feature would even be useful, sounds more unlikely than \\u003cem\\u003eJohn’s\\u003c/em\\u003e story.\\u003c/p\\u003e\\n\\u003cp\\u003eThis is just a total cluster F%$#!!\\u003c/p\\u003e\\n\\u003cp\\u003e(clears throat and straightens tie)\\u003c/p\\u003e\\n\\u003cp\\u003eI digress.\\u003c/p\\u003e\\n\\u003cp\\u003eOk, so Titor also mentions a “tweak” his grandfather made.\\u003c/p\\u003e\\n\\u003cp\\u003ePure speculation - Because the 5110 had I/O capacity for additional hardware and possible capability issues one might encounter in this particular situation. If the “tweak” was to enable the ability to debug and translate \\u003cstrong\\u003elegacy IBM code (System/360/370)\\u003c/strong\\u003e in 2036 with a modified 5110 prototype that may have existed in 1975.\\u003cbr\\u003e\\nNot a modified 5110, but a prototype that an IBM engineer personalized for John.\\u003c/p\\u003e\\n\\u003cp\\u003eAs much of a stretch that may be, it still seems more plausible to me than him making that level of “oops! and lies.”\\u003c/p\\u003e\",\"post_number\":17,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-09-07T07:36:31.012Z\",\"reply_count\":1,\"reply_to_post_number\":16,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":9,\"readers_count\":8,\"score\":6.8,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Jay Walker\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":2,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"reply_to_user\":{\"id\":135,\"username\":\"Darby\",\"name\":\"Darby\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/darby/{size}/9_2.png\"},\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":6894,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/17\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":118807,\"name\":\"Jay Walker\",\"username\":\"Jay_Walker\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/jay_walker/{size}/446_2.png\",\"created_at\":\"2025-09-07T01:02:03.547Z\",\"cooked\":\"\\u003cp\\u003eP.S. In the Oct, 2000 posts he said\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIts an IBM model 5110.\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0 : My grandfather worked on it.\\u003c/p\\u003e\\n\\u003cp\\u003eG° : because…?\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0 : Thats why I was sent.\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0 : We need it in 2036 to recode UNIX which dies in 2038.\\u003c/p\\u003e\\n\\u003cp\\u003eG° : who needed a 5110? and why?\\u003c/p\\u003e\\n\\u003cp\\u003eG° : lost me there, don’t enough about computers\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0 : the 5110 is able to read the old IBM mainframe code.\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0 : Its the first protable computer produced by IBM.\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0 : Actually its about the size of a small table.\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0 : We need on in 2036.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eThese 3 lines are objectively false.\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eTimeTravel_0 : the 5110 is able to read the old IBM mainframe code.\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0 : Its the first protable computer produced by IBM.\\u003c/p\\u003e\\n\\u003cp\\u003eTimeTravel_0 : Actually its about the size of a small table.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eThe 5110 was not portable, or a protable, or even potable. \\u003cem\\u003e( friggin’ lush, lol)\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe 5110 was not the size of a small table, it was the size of desktop.\\u003cbr\\u003e\\nand last but certainly not least…\\u003c/p\\u003e\\n\\u003cp\\u003eThe 5110 would have been useless for the purpose John said it would be used.\\u003cbr\\u003e\\nIt read APL and Basic (business) but did not translate mainframe codex.\\u003c/p\\u003e\\n\\u003cp\\u003eSo…\\u003c/p\\u003e\\n\\u003cp\\u003eHow could someone know so much about something and get it all wrong due to a nuance he would certainty been aware of based on the knowledge we know he had?\\u003c/p\\u003e\",\"post_number\":18,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-09-07T01:02:03.547Z\",\"reply_count\":1,\"reply_to_post_number\":17,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":12,\"readers_count\":11,\"score\":7.4,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Jay Walker\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"reply_to_user\":{\"id\":6894,\"username\":\"Jay_Walker\",\"name\":\"Jay Walker\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/jay_walker/{size}/446_2.png\"},\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":6894,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/original-yareisa-irc-conversation-with-timetravel-0-october-2000/16126/18\",\"event\":null,\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":118910,\"name\":\"Darby\",\"username\":\"Darby\",\"avatar_template\":\"/user_avatar/timetravelinstitute.com/darby/{size}/9_2.png\",\"created_at\":\"2025-09-12T10:25:46.410Z\",\"cooked\":\"\\u003caside class=\\\"quote no-group\\\" data-username=\\\"Jay_Walker\\\" data-post=\\\"18\\\" data-topic=\\\"16126\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://timetravelinstitute.com/user_avatar/timetravelinstitute.com/jay_walker/48/446_2.png\\\" class=\\\"avatar\\\"\\u003e Jay_Walker:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eHow could someone know so much about something and get it all wrong due to a nuance he would certainty been aware of based on the knowledge we know he had?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eJay,\\u003c/p\\u003e\\n\\u003cp\\u003eGo back and read the transcript again.  Pay particular to TimeTravel_0’s typos.  I noticed it from the get go.  As the night wore on he appears to have become drunk.  He did that a lot on the nights when we posted into the wee hours. 5100 becomes 5010 very easily.\\u003c/p\\u003e\\n\\u003cp\\u003eIt’s how Raul picked up on his original IP - the IP for his account here that wasn’t TimeTravel_0.  He was normally logging in on a proxy (early VPN) to mask his IP because the UBB BBS software for the site showed your IP next to every post.  But Raul said once in a while he forgot to use the VPN and logged in as TT0 using his real IP.  That’s a big part of why Raul unchecked that box on the BBS setup and turned off posting our IPs.  If you go back and look at the original threads you’ll see the IP box for everyone but they are blank.  Raul knew exactly who TTO was and it was a regular member here and not one of Razzie Award’s 50 suspects including Morie Amsterdam…errr…Titor…Haber. \\u003cimg src=\\\"https://timetravelinstitute.com/images/emoji/twemoji/cowboy_hat_face.png?v=14\\\" title=\\\":cowboy_hat_face:\\\" class=\\\"emoji\\\" alt=\\\":cowboy_hat_face:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003c/p\\u003e\",\"post_number\":19,\"post_type\":1,\"posts_count\":65,\"updated_at\":\"2025-09-12T10:33:44.713Z\",\"reply_count\":1,\"reply_to_post_number\":18,\"quote_count\":1,\"incoming_link_count\":0,\"reads\":13,\"readers_count\":12,\"score\":7.6,\"yours\":false,\"topic_id\":16126,\"topic_slug\":\"original-yareisa-irc-conversation-with-timetravel-0-october-2000\",\"display_username\":\"Darby\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":2,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[],\"moderator\":true,\"admin\":false,\"staff\":true,\"user_id\":135,\"hidden\":false,\"trust_level\":2,\               <p>In about 2005 I was able to verify that the following IRC conversation did, in fact, take place on 14-OCT-2000. It took me several years to get Yareisa to even acknowledge my emails to her, let alone get her to post on Anomalies about her contact with TimeTravel_0. Yareisa was reluctant to post because her take on TTO/Titor was that he was a creep and she didn’t want anything to do with him.  Her opinion was based on subsequent private contacts with him over the couple of weeks following 14-OCT-2000. Rick Donaldson was the member of our research team who received the anonymous email with the log attached.</p>
<p>As you read the conversation remember what I said about his drinking of adult beverages. Long before he spills the beans you will likely be able to tell from his typing that he’s drunk.  Down below when he says, “But Im a little pissed right now. Is that still the right word?” remember he’s talking to two Englishmen and an English woman. He’s pissed (English - drunk) not pissed-off (American - angry). Everyone on the chat missed it or just chose not to respond.</p>
<p>~Darby</p>
<h3><a name="p-16127-john-titor-irc-discussion-log-1" class="anchor" href="#p-16127-john-titor-irc-discussion-log-1" aria-label="Heading link"></a>John Titor IRC Discussion Log</h3>
<p>These logs, sent to the Anomalies network from an unnamed source, proport to show a late night conversation between the Time Traveler John and several other individuals on IRC.</p>
<p>We hope you enjoy these, and thanks for the information (you know who you are!).</p>
<h4><a name="p-16127-h-14-october-2000-2" class="anchor" href="#p-16127-h-14-october-2000-2" aria-label="Heading link"></a>14 October 2000</h4>
<pre><code class="lang-auto">* TimeTravel_0 has joined the conversation.

Yareisa: even now I still change my opinions, there is no definitive

Yareisa: lol

G°: g’night

TimeTravel_0: Hes 2

G°: yar, ok.

TimeTravel_0: Not my house. Im just visiting.
